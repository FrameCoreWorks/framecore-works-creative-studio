<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Oxanium"; font-weight: 700; src: url("assets/fonts/oxanium-latin-700-normal.woff2") format("woff2"); }
      @font-face { font-family: "Oxanium"; font-weight: 500; src: url("assets/fonts/oxanium-latin-500-normal.woff2") format("woff2"); }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #ffffff; }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #ffffff; font-family: "Oxanium", sans-serif; color: #141414; }
      #shake, #cam, #stage { position: absolute; inset: 0; transform-origin: 50% 50%; }
      /* The brief: a sticky note */
      .note { position: absolute; left: 470px; top: 150px; width: 980px; height: 780px; background: #fff3b0; padding: 80px 90px; box-shadow: 0 30px 60px rgba(0,0,0,0.12), 0 6px 14px rgba(0,0,0,0.08); transform-origin: 50% 50%; }
      .note h2 { font-size: 48px; font-weight: 700; letter-spacing: 10px; margin-bottom: 40px; }
      .note p { font-size: 66px; font-weight: 500; line-height: 1.5; white-space: nowrap; }
      /* The storyboard grid: four panels, each holding a 1920x1080 frame scaled to 0.375 */
      .panel { position: absolute; width: 720px; height: 405px; border: 5px solid #141414; border-radius: 18px; overflow: hidden; background: #fff; }
      .frame { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; transform: scale(0.375); overflow: hidden; }
      .cap { position: absolute; width: 720px; font-size: 30px; font-weight: 700; letter-spacing: 3px; white-space: nowrap; }
      .cap b { display: inline-block; width: 44px; height: 44px; margin-right: 14px; border-radius: 50%; background: #141414; color: #fff; text-align: center; line-height: 44px; font-size: 24px; letter-spacing: 0; vertical-align: middle; }
      .cap span { font-weight: 500; color: #6a6a6a; letter-spacing: 0; }
      .sk { position: absolute; inset: 0; }
      .sk text { font-family: "Oxanium", sans-serif; font-weight: 700; }
      /* Shared scene look, used at full size in the ad and at 0.375 in the panels */
      .sc { position: absolute; inset: 0; }
      .s1 { background: #e8833a; }
      .s2 { background: #141414; color: #fff; }
      .s3 { background: #ffffff; }
      .s4 { background: #e8833a; }
      .wheel { position: absolute; width: 520px; height: 520px; margin: -260px 0 0 -260px; }
      .big { position: absolute; font-weight: 700; white-space: nowrap; line-height: 1; }
      .mid { position: absolute; font-weight: 500; white-space: nowrap; line-height: 1; }
      .disk { position: absolute; width: 160px; height: 160px; margin: -80px 0 0 -80px; border-radius: 50%; background: #141414; }
      .star { position: absolute; font-size: 120px; color: #e8833a; line-height: 1; }
      #ad { position: absolute; inset: 0; opacity: 0; overflow: hidden; }
      #white { position: absolute; inset: 0; background: #fff; opacity: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="20.4" data-width="1920" data-height="1080">
      <div id="shake" class="clip-track" data-start="0" data-duration="20.4" data-track-index="0">
        <div id="cam"><div id="stage">
          <div id="grid"></div>
          <div class="note" id="note">
            <h2>BRIEF</h2>
            <p class="ln">Spoke &amp; Co., bike shop</p>
            <p class="ln">Spring sale, −20%</p>
            <p class="ln">1,200 happy riders</p>
            <p class="ln">Short ad, 16:9</p>
          </div>
        </div></div>
      </div>
      <div id="ad" class="frame" style="transform:none"></div>
      <div id="white"></div>
    </div>
    <script>
      // A client's brief becomes a storyboard, the first board is drawn and coloured, and the finished ad plays out of it;
      // each scene grows out of the one before (technique after @twoclipping in Studio's gallery). The shop is invented.
      const DUR = 20.4;
      const tl = gsap.timeline({ paused: true });
      window.__timelines = window.__timelines || {};
      const OFF = [[1, -0.6], [-0.8, 0.7], [0.55, 0.45], [-0.3, -0.35], [0.12, 0.1], [0, 0]];
      const hit = (t, amp) => tl.to("#shake", { keyframes: OFF.map(([x, y]) => ({ x: x * amp, y: y * amp, duration: 0.035, ease: "none" })) }, t);

      // Where the "o" of "Roll" sits; the wheel lands there.
      const O = { x: 868, y: 395 };
      const WHEEL = '<svg class="wheel" viewBox="-130 -130 260 260"><circle r="112" fill="none" stroke="#141414" stroke-width="22"/>' +
        Array.from({ length: 8 }, (_, i) => { const a = i * Math.PI / 4; return '<line x1="0" y1="0" x2="' + (100 * Math.cos(a)).toFixed(1) + '" y2="' + (100 * Math.sin(a)).toFixed(1) + '" stroke="#141414" stroke-width="7"/>'; }).join("") +
        '<circle r="20" fill="#141414"/></svg>';
      // The four boards' finished states. `full` adds the words that arrive later in board 1.
      const SC = {
        s1: (full) => '<div class="sc s1"><div class="w1" style="position:absolute;left:960px;top:540px">' + WHEEL + '</div>' +
          (full ? '<div class="big t1a" style="font-size:300px;right:' + (1920 - O.x + 92) + 'px;top:240px">R</div><div class="big t1b" style="font-size:300px;left:' + (O.x + 88) + 'px;top:240px">ll</div><div class="big t1c" style="font-size:150px;left:0;width:1920px;text-align:center;top:610px">into spring.</div>' : '') + '</div>',
        s2: () => '<div class="sc s2"><div class="big t2a" style="font-size:420px;left:0;width:1920px;text-align:center;top:250px">−20%</div><div class="mid t2b" style="font-size:56px;left:0;width:1920px;text-align:center;top:740px">on every bike, until 30 April</div></div>',
        s3: () => '<div class="sc s3"><div class="big t3a" style="font-size:150px;left:0;width:1920px;text-align:center;top:300px">1,200 happy riders</div>' +
          [0, 1, 2, 3, 4].map((i) => '<div class="star st" style="left:' + (660 + i * 128) + 'px;top:560px">★</div>').join("") + '</div>',
        s4: () => '<div class="sc s4"><div class="w4" style="position:absolute;left:560px;top:470px;transform:scale(0.42)">' + WHEEL + '</div><div class="big t4a" style="font-size:190px;left:730px;top:375px">Spoke &amp; Co.</div><div class="mid t4b" style="font-size:60px;left:740px;top:620px">Spring sale · −20%</div></div>',
      };

      // Storyboard grid: four panels with captions below.
      const P = [{ x: 210, y: 60 }, { x: 990, y: 60 }, { x: 210, y: 565 }, { x: 990, y: 565 }];
      const CAP = [["HOOK", "spring"], ["OFFER", "−20%"], ["PROOF", "1,200 riders"], ["LOGO", "Spoke & Co."]];
      const grid = document.getElementById("grid");
      P.forEach((p, i) => {
        p.cx = p.x + 360; p.cy = p.y + 202.5;
        const el = document.createElement("div");
        el.className = "panel"; el.id = "p" + i; el.style.left = p.x + "px"; el.style.top = p.y + "px";
        // pencil sketch first, finished board on top (hidden until coloured)
        const sketch = [
          '<svg class="sk" viewBox="0 0 1920 1080"><circle id="skc" cx="960" cy="540" r="250" fill="none" stroke="#9a9a9a" stroke-width="8"/>' +
            Array.from({ length: 8 }, (_, k) => { const a = k * Math.PI / 4; return '<line class="sks" x1="960" y1="540" x2="' + (960 + 225 * Math.cos(a)).toFixed(1) + '" y2="' + (540 + 225 * Math.sin(a)).toFixed(1) + '" stroke="#9a9a9a" stroke-width="7"/>'; }).join("") + '</svg>',
          '<svg class="sk" viewBox="0 0 1920 1080"><text x="960" y="640" text-anchor="middle" font-size="380" fill="none" stroke="#9a9a9a" stroke-width="6">−20%</text></svg>',
          '<svg class="sk" viewBox="0 0 1920 1080"><text x="960" y="440" text-anchor="middle" font-size="140" fill="none" stroke="#9a9a9a" stroke-width="5">1,200 riders</text><text x="960" y="700" text-anchor="middle" font-size="150" fill="none" stroke="#9a9a9a" stroke-width="5">☆☆☆☆☆</text></svg>',
          '<svg class="sk" viewBox="0 0 1920 1080"><circle cx="560" cy="540" r="105" fill="none" stroke="#9a9a9a" stroke-width="6"/><text x="730" y="600" font-size="180" fill="none" stroke="#9a9a9a" stroke-width="5">Spoke &amp; Co.</text></svg>',
        ][i];
        el.innerHTML = '<div class="frame">' + sketch + '<div class="fin" style="position:absolute;inset:0;opacity:0">' + SC["s" + (i + 1)](i > 0) + '</div></div>';
        grid.appendChild(el);
        const cap = document.createElement("div");
        cap.className = "cap"; cap.id = "c" + i; cap.style.left = p.x + "px"; cap.style.top = (p.y + 420) + "px";
        cap.innerHTML = "<b>" + (i + 1) + "</b>" + CAP[i][0] + " &nbsp;<span>" + CAP[i][1] + "</span>";
        grid.appendChild(cap);
      });
      // board 1's finished words exist only in the ad until the end
      const p0fin = document.querySelector("#p0 .fin");
      p0fin.insertAdjacentHTML("beforeend", '<div class="late" style="position:absolute;inset:0;opacity:0">' + SC.s1(true) + '</div>');
      gsap.set("#p0 .late .w1", { x: O.x - 960, y: O.y - 540, scale: 0.33, rotation: -540 });

      // ---- A: the brief lands and is read (0 - 3.0)
      tl.fromTo("#note", { y: -900, rotation: -14 }, { y: 0, rotation: -2.5, duration: 0.6, ease: "power3.out", immediateRender: true }, 0);
      hit(0.6, 6);
      document.querySelectorAll(".ln").forEach((l, i) =>
        tl.fromTo(l, { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.3, ease: "power2.out", immediateRender: true }, 0.75 + i * 0.3));
      // ---- B: the note folds away and four boards fly out of it (3.0 - 5.4)
      tl.to("#note", { scale: 0.15, rotation: 8, opacity: 0, duration: 0.45, ease: "power3.in" }, 3.0);
      P.forEach((p, i) => {
        tl.fromTo("#p" + i, { x: 960 - p.cx, y: 540 - p.cy, scale: 0.2, rotation: (i % 2 ? 6 : -6), opacity: 0 },
          { x: 0, y: 0, scale: 1, rotation: 0, opacity: 1, duration: 0.55, ease: "back.out(1.4)", immediateRender: true }, 3.25 + i * 0.09);
        tl.fromTo("#c" + i, { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.3, ease: "power2.out", immediateRender: true }, 3.8 + i * 0.12);
      });
      hit(3.85, 5);

      // ---- C: board 1 is drawn line by line, then coloured (5.4 - 8.2)
      const skc = document.getElementById("skc"), circ = 2 * Math.PI * 250;
      const sks = [...document.querySelectorAll("#p0 .sks")];
      skc.setAttribute("stroke-dasharray", circ); skc.setAttribute("stroke-dashoffset", circ);
      sks.forEach((l) => { l.setAttribute("stroke-dasharray", 230); l.setAttribute("stroke-dashoffset", 230); });
      const pen = { c: 0, s: 0 };
      tl.fromTo(pen, { c: 0, s: 0 }, { keyframes: [{ c: 1, duration: 0.7, ease: "power1.inOut" }, { s: 8, duration: 0.7, ease: "none" }], immediateRender: false,
        onUpdate: () => {
          skc.setAttribute("stroke-dashoffset", (circ * (1 - pen.c)).toFixed(1));
          sks.forEach((l, k) => l.setAttribute("stroke-dashoffset", (230 * (1 - Math.min(1, Math.max(0, pen.s - k)))).toFixed(1)));
        } }, 5.95);
      tl.fromTo("#p0 .fin", { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "power2.out", immediateRender: true }, 7.5);
      hit(7.55, 4);

      // ---- D: the camera lands with board 1 filling the frame; the full-size ad takes over (8.7 - 17.4)
      const ad = document.getElementById("ad");
      ad.innerHTML = SC.s1(true) + '<div class="lay2" style="position:absolute;inset:0">' + '<div class="disk" style="left:' + O.x + 'px;top:' + O.y + 'px"></div>' + SC.s2().replace('class="sc s2"', 'class="sc s2" style="background:none"') + '</div>' +
        '<div class="lay3" style="position:absolute;inset:0">' + SC.s3() + '</div><div class="lay4" style="position:absolute;inset:0">' + SC.s4() + '</div>';
      const IN = 8.7;
      tl.set("#ad", { opacity: 1 }, IN);
      gsap.set("#ad .lay3", { yPercent: 100 }); gsap.set("#ad .lay4 .sc", { scaleX: 0, transformOrigin: "0% 50%" });
      gsap.set(["#ad .lay4 .w4", "#ad .t4a", "#ad .t4b"], { opacity: 0 });
      // D1: the wheel rolls left into the "o" as the words arrive
      const W1 = "#ad .w1";
      tl.fromTo(W1, { x: 0, y: 0, scale: 1, rotation: 0 }, { x: O.x - 960, y: O.y - 540, scale: 0.33, rotation: -540, duration: 0.8, ease: "power3.inOut", immediateRender: true }, IN + 0.35);
      tl.fromTo("#ad .t1a", { x: -300, opacity: 0 }, { x: 0, opacity: 1, duration: 0.45, ease: "power3.out", immediateRender: true }, IN + 0.75);
      tl.fromTo("#ad .t1b", { x: 300, opacity: 0 }, { x: 0, opacity: 1, duration: 0.45, ease: "power3.out", immediateRender: true }, IN + 0.75);
      tl.fromTo("#ad .t1c", { y: 80, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: "power3.out", immediateRender: true }, IN + 1.0);
      hit(IN + 1.15, 7);
      // slow push on the held words so the holds keep breathing
      tl.fromTo(["#ad .t1a", "#ad .t1b", "#ad .t1c"], { scale: 1 }, { scale: 1.05, duration: 1.4, ease: "none", immediateRender: false }, IN + 1.2);
      tl.fromTo("#ad .t2a", { scale: 1 }, { scale: 1.06, duration: 1.3, ease: "none", immediateRender: false, overwrite: false }, IN + 2.55 + 0.85);
      tl.fromTo("#ad .t3a", { scale: 1 }, { scale: 1.05, duration: 1.4, ease: "none", immediateRender: false }, IN + 2.55 + 2.4 + 0.75);
      // D2: the wheel's hub grows into a black field and the offer slams in
      const D2 = IN + 2.55;
      tl.fromTo("#ad .disk", { scale: 0 }, { scale: 30, duration: 0.55, ease: "power3.in", immediateRender: true }, D2);
      tl.fromTo("#ad .t2a", { scale: 2.6, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.3, ease: "power4.in", immediateRender: true }, D2 + 0.5);
      hit(D2 + 0.8, 14);
      tl.fromTo("#ad .t2b", { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.35, ease: "power2.out", immediateRender: true }, D2 + 0.95);
      // D3: proof wipes up from below, stars pop one by one
      const D3 = D2 + 2.4;
      tl.fromTo("#ad .lay3", { yPercent: 100 }, { yPercent: 0, duration: 0.5, ease: "expo.inOut", immediateRender: false }, D3);
      tl.fromTo("#ad .t3a", { y: 60, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: "power3.out", immediateRender: true }, D3 + 0.3);
      document.querySelectorAll("#ad .st").forEach((s, i) => {
        tl.fromTo(s, { scale: 0, rotation: -60 }, { scale: 1, rotation: 0, duration: 0.3, ease: "back.out(2.5)", immediateRender: true }, D3 + 0.55 + i * 0.12);
      });
      // D4: the end card sweeps in from the left; the wheel comes back as the logo mark
      const D4 = D3 + 2.2;
      tl.fromTo("#ad .lay4 .sc", { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "expo.inOut", immediateRender: false }, D4);
      tl.fromTo("#ad .w4", { opacity: 0, x: -200, rotation: -360 }, { opacity: 1, x: 0, rotation: 0, duration: 0.6, ease: "power3.out", immediateRender: false }, D4 + 0.35);
      tl.fromTo("#ad .t4a", { opacity: 0, x: 80 }, { opacity: 1, x: 0, duration: 0.45, ease: "power3.out", immediateRender: false }, D4 + 0.5);
      tl.fromTo("#ad .t4b", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.35, ease: "power2.out", immediateRender: false }, D4 + 0.75);
      tl.fromTo("#ad .w4 svg", { rotation: 0 }, { rotation: 200, duration: 2.0, ease: "none", immediateRender: false }, D4 + 0.95);

      // ---- E: back on the storyboard, every board now finished; the one pull-back comes at the very end
      const BACK = D4 + 2.2;
      document.querySelectorAll(".panel:not(#p0) .fin").forEach((f) => gsap.set(f, { opacity: 0 }));
      tl.set(".panel:not(#p0) .fin", { opacity: 1 }, BACK);
      tl.set("#p0 .late", { opacity: 1 }, BACK);
      tl.set("#p3 .w4 svg", { rotation: 200 }, BACK);
      tl.set("#ad", { opacity: 0 }, BACK);

      // Camera: shots with holds; moves only push in or travel, except the final pull-back.
      const SHOTS = [];
      const shot = (a, d, px, py, s, r = 0, drift = 0.02) => SHOTS.push({ a, d, px, py, ls: Math.log(s), r, drift });
      const S = 1920 / 720;
      shot(0, 0.01, 960, 540, 0.9, 0, 0.03);
      shot(0.6, 0.8, 960, 540, 1.0, 0, 0.035);                 // read the brief
      shot(5.4, 0.55, P[0].cx, P[0].cy, 2.2, -1, 0.03);       // into board 1 while it is drawn
      shot(IN - 0.5, 0.5, P[0].cx, P[0].cy, S, 0, 0);        // board 1 fills the frame exactly
      shot(BACK, 0.01, P[3].cx, P[3].cy, S, 0, 0);           // the ad ends on its end card = board 4
      shot(BACK + 0.15, 1.0, 960, 540, 1.0, 0, 0.04);       // the only pull-back, to the finished storyboard
      SHOTS.sort((a, b) => a.a - b.a);
      const ease = (u) => u <= 0 ? 0 : u >= 1 ? 1 : u < 0.5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2;
      function camAt(T) {
        let i = 0; while (i < SHOTS.length - 1 && T >= SHOTS[i + 1].a) i++;
        const b = SHOTS[i], a = i > 0 ? SHOTS[i - 1] : b;
        const ad0 = Math.max(0, b.a - (a.a + a.d)) * a.drift;
        const e = ease(Math.min(1, (T - b.a) / b.d));
        const hold = Math.max(0, T - (b.a + b.d)) * b.drift;
        return [a.px + (b.px - a.px) * e, a.py + (b.py - a.py) * e, (a.ls + ad0) + (b.ls - a.ls - ad0) * e + hold, a.r + (b.r - a.r) * e];
      }
      const cs = { t: 0 };
      const applyCam = () => { const [px, py, ls, r] = camAt(cs.t), s = Math.exp(ls); gsap.set("#cam", { scale: s, x: (960 - px) * s, y: (540 - py) * s, rotationZ: r }); };
      tl.fromTo(cs, { t: 0 }, { t: DUR, duration: DUR, ease: "none", onUpdate: applyCam, immediateRender: true }, 0);

      tl.fromTo("#white", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power1.in", immediateRender: true }, DUR - 0.4);
      tl.to({}, { duration: 0.01 }, DUR - 0.01);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
