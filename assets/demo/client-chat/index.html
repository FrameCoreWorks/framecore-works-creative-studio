<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Oxanium"; font-weight: 700; src: url("assets/fonts/oxanium-latin-700-normal.woff2") format("woff2"); }
      @font-face { font-family: "Oxanium"; font-weight: 500; src: url("assets/fonts/oxanium-latin-500-normal.woff2") format("woff2"); }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #ffffff; }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #ffffff; perspective: 1600px; font-family: "Oxanium", sans-serif; color: #141414; }
      #shake, #cam, #stage { position: absolute; inset: 0; transform-origin: 50% 50%; }
      #cam { transform-style: preserve-3d; }
      /* Phone drawn in code: titanium frame, black bezel, island, side buttons, home bar. */
      .phone { position: absolute; left: 700px; top: 30px; width: 520px; height: 1020px; border-radius: 84px;
        background: linear-gradient(145deg, #55555a 0%, #1d1d20 38%, #404045 68%, #18181a 100%);
        box-shadow: 0 50px 90px rgba(0,0,0,0.16), 0 12px 24px rgba(0,0,0,0.12), inset 0 0 0 2px rgba(255,255,255,0.22); }
      .phone::before { content: ""; position: absolute; inset: 5px; border-radius: 79px; background: #0b0b0c; }
      .btn { position: absolute; width: 6px; border-radius: 3px; background: linear-gradient(90deg, #2c2c30, #5a5a60); }
      .screen { position: absolute; inset: 14px; border-radius: 70px; overflow: hidden; background: #fff; }
      .island { position: absolute; left: 50%; top: 14px; width: 128px; height: 38px; margin-left: -64px; border-radius: 20px; background: #0b0b0c; z-index: 5; }
      .status { position: absolute; left: 50px; right: 40px; top: 20px; height: 40px; display: flex; justify-content: space-between; align-items: center; font-weight: 700; font-size: 21px; z-index: 4; }
      .icons { display: flex; align-items: flex-end; gap: 3px; }
      .icons i { display: block; width: 5px; background: #141414; border-radius: 1px; }
      .bat { position: relative; width: 30px; height: 15px; border: 2px solid #141414; border-radius: 4px; margin-left: 8px; }
      .bat::after { content: ""; position: absolute; left: 2px; top: 2px; bottom: 2px; width: 18px; background: #141414; border-radius: 1px; }
      .head { position: absolute; left: 0; right: 0; top: 62px; height: 88px; display: flex; align-items: center; gap: 14px; padding: 0 26px; border-bottom: 2px solid #ececec; background: #fff; z-index: 3; }
      .back { font-size: 44px; font-weight: 500; line-height: 1; margin-top: -6px; }
      .avatar { position: relative; width: 54px; height: 54px; border-radius: 50%; background: #e8833a; color: #fff; font-weight: 700; font-size: 28px; display: flex; align-items: center; justify-content: center; }
      .avatar::after { content: ""; position: absolute; right: 0; bottom: 0; width: 14px; height: 14px; border-radius: 50%; background: #3bbf6a; border: 3px solid #fff; }
      .head b { font-size: 27px; font-weight: 700; display: block; line-height: 1.1; }
      .head small { font-size: 17px; font-weight: 500; color: #7a7a7a; }
      .msgs { position: absolute; left: 0; right: 0; top: 150px; bottom: 112px; overflow: hidden; }
      .list { position: absolute; left: 0; right: 0; top: 0; }
      .msg { position: absolute; height: 62px; padding: 0 22px; display: flex; align-items: center; border-radius: 28px; font-size: 25px; font-weight: 500; white-space: nowrap; opacity: 0; }
      .msg.them { left: 20px; background: #f0f0f0; border-bottom-left-radius: 8px; transform-origin: 0% 100%; }
      .msg.me { right: 20px; background: #141414; color: #fff; border-bottom-right-radius: 8px; transform-origin: 100% 100%; }
      .video { position: absolute; right: 20px; width: 250px; height: 430px; border-radius: 28px; border-bottom-right-radius: 8px; overflow: hidden; background: #141414; padding: 8px; opacity: 0; transform-origin: 100% 100%; }
      .clip { position: relative; width: 100%; height: 100%; border-radius: 20px; overflow: hidden; background: #e8833a; }
      .board { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; padding: 0 22px; font-weight: 700; line-height: 0.95; }
      .board span { display: block; }
      .b1 { background: #e8833a; }
      .b3 { background: #3b2418; color: #f3e6d3; font-size: 40px; text-align: center; align-items: center; }
      .b3 small { display: block; margin-top: 16px; font-size: 18px; letter-spacing: 6px; font-weight: 500; }
      .cup { position: absolute; left: 50%; bottom: 70px; width: 70px; height: 70px; margin-left: -35px; border-radius: 50%; border: 6px solid currentColor; }
      .dots { position: absolute; right: 20px; width: 110px; height: 62px; border-radius: 28px; border-bottom-right-radius: 8px; background: #141414; opacity: 0; transform-origin: 100% 100%; }
      .dots i { position: absolute; top: 25px; width: 13px; height: 13px; border-radius: 50%; background: #fff; }
      .play { position: absolute; left: 50%; top: 50%; width: 76px; height: 76px; margin: -38px 0 0 -38px; border-radius: 50%; background: rgba(20,20,20,0.75); }
      .play::after { content: ""; position: absolute; left: 30px; top: 22px; border-left: 24px solid #fff; border-top: 16px solid transparent; border-bottom: 16px solid transparent; }
      .input { position: absolute; left: 20px; right: 20px; bottom: 34px; height: 62px; background: #f0f0f0; border-radius: 31px; display: flex; align-items: center; padding: 0 22px; font-size: 23px; font-weight: 500; color: #9a9a9a; }
      .input .typed { color: #141414; white-space: pre; }
      .input .caret { display: inline-block; width: 3px; height: 28px; background: #141414; margin-left: 2px; }
      .send { position: absolute; right: 6px; top: 6px; width: 50px; height: 50px; border-radius: 50%; background: #141414; }
      .send::after { content: ""; position: absolute; left: 19px; top: 15px; border-left: 16px solid #fff; border-top: 10px solid transparent; border-bottom: 10px solid transparent; }
      .homebar { position: absolute; left: 50%; bottom: 10px; width: 150px; height: 6px; margin-left: -75px; border-radius: 3px; background: #141414; }
      .glass { position: absolute; inset: 0; border-radius: 70px; background: linear-gradient(118deg, rgba(255,255,255,0) 35%, rgba(255,255,255,0.16) 46%, rgba(255,255,255,0) 58%); z-index: 6; }
      /* The reel taking over the frame. */
      #reel { position: absolute; inset: 0; opacity: 0; overflow: hidden; }
      .rb { position: absolute; inset: 0; }
      .wing { position: absolute; inset: 0; }
      .rb1 .wing { background: #e8833a; }
      .rb2 .wing { background: #f3e6d3; }
      .rb3 .wing { background: #3b2418; }
      .big { position: absolute; font-weight: 700; line-height: 0.92; white-space: nowrap; }
      .w1 { left: 200px; color: #fff; font-size: 210px; }
      .w2 { left: 200px; font-size: 170px; color: #3b2418; }
      .steam { position: absolute; width: 22px; height: 150px; border-radius: 11px; background: #3b2418; opacity: 0; }
      .rcup { position: absolute; left: 1380px; top: 560px; width: 300px; height: 230px; border: 22px solid #3b2418; border-top: none; border-radius: 0 0 150px 150px; }
      .rcup::after { content: ""; position: absolute; right: -96px; top: 20px; width: 90px; height: 110px; border: 22px solid #3b2418; border-left: none; border-radius: 0 60px 60px 0; }
      .rsaucer { position: absolute; left: 1320px; top: 800px; width: 420px; height: 22px; border-radius: 11px; background: #3b2418; }
      .top { position: absolute; left: 1300px; top: 280px; width: 520px; height: 520px; border-radius: 50%; background: #f3e6d3; }
      .top::before { content: ""; position: absolute; inset: 46px; border-radius: 50%; background: #3b2418; }
      .top::after { content: ""; position: absolute; right: -96px; top: 215px; width: 110px; height: 90px; border-radius: 0 45px 45px 0; background: #f3e6d3; z-index: -1; }
      .clone { position: absolute; left: 960px; top: 540px; width: 234px; height: 414px; margin: -207px 0 0 -117px; }
      #white { position: absolute; inset: 0; background: #fff; opacity: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="18.1" data-width="1920" data-height="1080">
      <div id="shake" class="clip-track" data-start="0" data-duration="18.1" data-track-index="0">
        <div id="cam"><div id="stage">
          <div class="phone" id="phone">
            <div class="btn" style="left:-4px;top:190px;height:44px"></div>
            <div class="btn" style="left:-4px;top:270px;height:84px"></div>
            <div class="btn" style="left:-4px;top:370px;height:84px"></div>
            <div class="btn" style="right:-4px;top:300px;height:130px"></div>
            <div class="screen">
              <div class="island"></div>
              <div class="status"><span>9:41</span><span class="icons"><i style="height:7px"></i><i style="height:11px"></i><i style="height:15px"></i><i style="height:19px"></i><span class="bat"></span></span></div>
              <div class="head"><span class="back">‹</span><div class="avatar">C</div><div><b>Café Bloom</b><small>new client · online</small></div></div>
              <div class="msgs"><div class="list" id="list"></div></div>
              <div class="input"><span class="typed" id="typed"></span><span class="caret" id="caret"></span><span id="ph">Message</span><div class="send"></div></div>
              <div class="homebar"></div>
              <div class="glass"></div>
            </div>
          </div>
        </div></div>
      </div>
      <div id="reel">
        <div class="rb rb1"><div class="wing" id="wing1"></div><div class="top" id="top"></div>
          <div class="big w1" style="top:110px">Fresh.</div><div class="big w1" style="top:330px">Every.</div><div class="big w1" style="top:550px">Morning.</div></div>
        <div class="rb rb2"><div class="wing"></div>
          <div class="big w2" style="top:300px">Slow mornings,</div><div class="big w2" style="top:480px;color:#e8833a">good coffee.</div>
          <div class="steam" style="left:1460px;top:330px"></div><div class="steam" style="left:1520px;top:300px"></div><div class="steam" style="left:1580px;top:330px"></div>
          <div class="rcup"></div><div class="rsaucer"></div></div>
        <div class="rb rb3"><div class="wing" id="wing3"></div>
          <div class="clone" id="clone"><div class="board b3" style="background:none"><span>Café Bloom</span><small>OPENS MONDAY</small><div class="cup"></div></div></div></div>
      </div>
      <div id="white"></div>
    </div>
    <script>
      // A new client writes to FrameCore Works; the creator asks one question, sends the finished reel,
      // and the reel bursts out of its bubble to fill the frame. The café and the people are staged, not testimonials.
      const DUR = 18.1;
      const tl = gsap.timeline({ paused: true });
      window.__timelines = window.__timelines || {};
      const list = document.getElementById("list");
      const SCREEN = { x: 714, y: 44, w: 492, listTop: 150, visible: 992 - 150 - 112 };
      const OFF = [[1, -0.6], [-0.8, 0.7], [0.55, 0.45], [-0.3, -0.35], [0.12, 0.1], [0, 0]];
      const hit = (t, amp) => tl.to("#shake", { keyframes: OFF.map(([x, y]) => ({ x: x * amp, y: y * amp, duration: 0.035, ease: "none" })) }, t);

      // Messages: about 0.75 s reading time for a short line, typing about 0.045 s per character.
      const SCRIPT = [
        { who: "them", text: "Hi! Our café opens on Monday.", t: 0.8 },
        { who: "them", text: "Can you make us a motion reel?", t: 1.55 },
        { who: "me", text: "Hi! FrameCore Works here.", t: 4.0, typeFrom: 2.95 },
        { who: "me", text: "Sure! What's the mood?", t: 4.75 },
        { who: "them", text: "Cosy. Slow mornings, good coffee.", t: 5.6 },
        { who: "me", text: "On it.", t: 7.6, typeFrom: 6.9, close: true },
        { who: "me", dots: true, t: 8.15, gone: 9.6 },
        { who: "me", video: true, t: 9.85 },
        { who: "them", text: "Wow. Posting it today!", t: 16.15 },
      ];
      const P = 10.55, IN = P + 0.42, BACK = 15.67;

      // Camera: a list of shots; it whips between them (expo in-out with a zoom dip) and drifts in slowly while holding.
      const SHOTS = [];
      const shot = (a, d, px, py, s, r, drift = 0.035) => SHOTS.push({ a, d, px, py, ls: Math.log(s), r, drift });
      shot(0, 0.01, 960, 560, 0.97, 0, 0.02);

      let y = 18, scroll = 0, side = 1;
      for (const m of SCRIPT) {
        const h = m.video ? 430 : 62;
        const el = document.createElement("div");
        if (m.video) {
          el.className = "video";
          el.innerHTML = '<div class="clip"><div class="board b1"></div><div class="board b3" id="vb3"><span>Café Bloom</span><small>OPENS MONDAY</small><div class="cup"></div></div></div><div class="play" id="play"></div>';
        } else if (m.dots) {
          el.className = "dots";
          el.innerHTML = '<i style="left:24px"></i><i style="left:48px"></i><i style="left:72px"></i>';
        } else { el.className = "msg " + m.who; el.textContent = m.text; }
        el.style.top = y + "px";
        list.appendChild(el);
        const need = Math.max(0, y + h + 16 - SCREEN.visible);
        if (need > scroll) { tl.to(list, { y: -need, duration: 0.3, ease: "power3.out" }, m.t - 0.05); scroll = need; }
        tl.fromTo(el, { opacity: 0, scale: 0.5, y: m.close ? 150 : 30 }, { opacity: 1, scale: 1, y: 0, duration: 0.3, ease: "back.out(2.4)", immediateRender: true }, m.t);
        if (!m.video || true) hit(m.t + 0.06, m.video ? 9 : 5);
        m.cy = SCREEN.y + SCREEN.listTop + y - scroll + h / 2;
        side = -side;
        if (m.typeFrom !== undefined) {
          // the camera drops to the input bar while the creator types, then whips up to the sent bubble
          const typed = document.getElementById("typed"), st = { n: 0 };
          tl.set("#ph", { display: "none" }, m.typeFrom);
          tl.fromTo(st, { n: 0 }, { n: m.text.length, duration: m.t - 0.12 - m.typeFrom, ease: "none", immediateRender: false,
            onUpdate: () => { typed.textContent = m.text.slice(0, Math.round(st.n)); } }, m.typeFrom);
          tl.set(typed, { textContent: "" }, m.t);
          tl.set("#ph", { display: "inline" }, m.t);
        }
        if (m.video) {
          m.cx = SCREEN.x + SCREEN.w - 20 - 125;
          VID = m;
        }
        if (m.dots) {
          // "typing…": the three dots bounce one, two, three, twice, then the bubble gives way to the reel in the same place
          el.querySelectorAll("i").forEach((d, i) => {
            for (let c = 0; c < 2; c++) {
              const t0 = m.t + 0.3 + c * 0.6 + i * 0.14;
              tl.fromTo(d, { y: 0, opacity: 0.45 }, { keyframes: [{ y: -9, opacity: 1, duration: 0.16, ease: "power2.out" }, { y: 0, opacity: 0.45, duration: 0.2, ease: "power2.in" }], immediateRender: c === 0 && i >= 0 }, t0);
            }
          });
          tl.to(el, { scale: 0, opacity: 0, duration: 0.2, ease: "back.in(2)" }, m.gone);
          continue;
        }
        y += h + 16;
      }
      var VID;
      // Few shots, each with a real hold (about 1 s or more) so every line can be read.
      const M = SCRIPT, mid = (a, b) => (a.cy + b.cy) / 2;
      shot(0.55, 0.5, 900, mid(M[0], M[1]), 2.4, -1.5, 0.02);       // the client's two lines, held to 2.45
      shot(2.45, 0.5, 960, 971, 2.6, 0, 0.02);                       // typing the greeting, held to 4.0
      shot(4.0, 0.55, 980, M[2].cy + 20, 2.4, 1.5, 0.02);           // greeting sent, then the question pops below it
      shot(5.35, 0.5, 960, mid(M[3], M[4]), 2.4, -1, 0.02);          // the client's answer, held to 6.4
      shot(6.4, 0.5, 880, 971, 3.6, 0, 0.02);                        // close on "On it." being typed, held to 7.6
      shot(7.6, 0.55, 1060, M[5].cy, 3.6, 1.5, 0.02);                // the sent bubble, held to 8.2
      shot(8.05, 0.5, 1080, (M[5].cy + M[6].cy) / 2, 3.0, 0, 0.02);   // "On it." and the dots, held while they bounce
      shot(9.75, 0.5, VID.cx - 60, VID.cy, 1.75, -1.5, 0.02);         // the reel arrives
      const M6 = M[8];
      shot(M6.t - 0.14, 0.4, 880, M6.cy, 2.5, 1.5);
      // Hand-off: the camera lands exactly on the clip (it fills the frame height), then the reel layer takes over at the same size.
      const S = 1080 / 414;
      shot(P, IN - P, VID.cx, VID.cy, S, 0, 0);
      shot(BACK + 0.08, 0.38, VID.cx - 60, VID.cy - 40, 1.6, 1.5);
      shot(DUR - 0.75, 0.55, 960, 540, 0.95, 0, 0.02);
      SHOTS.sort((a, b) => a.a - b.a);

      const ease = (u) => u <= 0 ? 0 : u >= 1 ? 1 : u < 0.5 ? Math.pow(2, 20 * u - 10) / 2 : (2 - Math.pow(2, -20 * u + 10)) / 2;
      function camAt(T) {
        let i = 0; while (i < SHOTS.length - 1 && T >= SHOTS[i + 1].a) i++;
        const b = SHOTS[i], a = i > 0 ? SHOTS[i - 1] : b;
        // where the previous shot had drifted to when this move began
        const ad = Math.max(0, b.a - (a.a + a.d)) * a.drift;
        const u = Math.min(1, (T - b.a) / b.d), e = ease(u);
        const hold = Math.max(0, T - (b.a + b.d)) * b.drift;
        const dip = 0;
        return [a.px + (b.px - a.px) * e, a.py + (b.py - a.py) * e, (a.ls + ad) + (b.ls - a.ls - ad) * e - dip + hold, a.r + (b.r - a.r) * e];
      }
      const cs = { t: 0 };
      const applyCam = () => { const [px, py, ls, r] = camAt(cs.t), s = Math.exp(ls); gsap.set("#cam", { scale: s, x: (960 - px) * s, y: (540 - py) * s, rotationZ: r }); };
      tl.fromTo(cs, { t: 0 }, { t: DUR, duration: DUR, ease: "none", onUpdate: applyCam, immediateRender: true }, 0);

      // Opening: the phone swings up into the shot.
      tl.fromTo("#phone", { y: 1100, rotation: -12, rotationX: 35 }, { y: 0, rotation: 0, rotationX: 0, duration: 0.7, ease: "power3.out", immediateRender: true }, 0);
      tl.to("#caret", { keyframes: [{ opacity: 0, duration: 0.01 }, { opacity: 0, duration: 0.25 }, { opacity: 1, duration: 0.01 }, { opacity: 1, duration: 0.25 }], repeat: 26 }, 0.4);

      // The reel: play pops while the camera dives in, the orange panel swaps in at the same size and its wings open to full frame.
      const W0 = (234 * S) / 1920;
      tl.to("#play", { scale: 0, opacity: 0, duration: 0.18, ease: "power2.in" }, P);
      gsap.set("#wing1", { scaleX: W0 });
      gsap.set([".rb2", ".rb3"], { yPercent: 100 });
      tl.set("#reel", { opacity: 1 }, IN);
      tl.fromTo("#wing1", { scaleX: W0 }, { scaleX: 1, duration: 0.42, ease: "expo.out", immediateRender: false }, IN);
      hit(IN + 0.05, 14);
      document.querySelectorAll(".w1").forEach((w, i) => {
        tl.fromTo(w, { scale: 2.6, opacity: 0, x: 120 }, { scale: 1, opacity: 1, x: 0, duration: 0.24, ease: "power4.in", immediateRender: true }, IN + 0.35 + i * 0.27);
        hit(IN + 0.59 + i * 0.27, 10);
      });
      // a cup seen from above rolls in behind the words: latte art as the café's sign
      tl.fromTo("#top", { scale: 0, rotation: -120 }, { scale: 1, rotation: 0, duration: 0.6, ease: "back.out(1.5)", immediateRender: true }, IN + 0.25);
      tl.fromTo("#top", { rotation: 0 }, { rotation: 35, duration: 1.2, ease: "none", immediateRender: false }, IN + 0.85);
      const B2 = IN + 1.6;
      tl.fromTo(".rb2", { yPercent: 100 }, { yPercent: 0, duration: 0.45, ease: "expo.inOut", immediateRender: false }, B2);
      document.querySelectorAll(".w2").forEach((w, i) =>
        tl.fromTo(w, { y: 140, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: "power3.out", immediateRender: true }, B2 + 0.25 + i * 0.16));
      tl.fromTo(".rcup", { y: 300 }, { y: 0, duration: 0.5, ease: "back.out(1.6)", immediateRender: true }, B2 + 0.3);
      tl.fromTo(".rsaucer", { scaleX: 0 }, { scaleX: 1, duration: 0.4, ease: "power3.out", immediateRender: true }, B2 + 0.3);
      document.querySelectorAll(".steam").forEach((s, i) =>
        tl.fromTo(s, { y: 120, opacity: 0, scaleY: 0.4 }, { keyframes: [{ y: 20, opacity: 1, scaleY: 1, duration: 0.5 }, { y: -90, opacity: 0, scaleY: 0.6, duration: 0.6 }], ease: "sine.inOut", repeat: 1, immediateRender: true }, B2 + 0.7 + i * 0.18));
      const B3 = B2 + 1.6;
      tl.fromTo(".rb3", { yPercent: 100 }, { yPercent: 0, duration: 0.45, ease: "expo.inOut", immediateRender: false }, B3);
      // the name fills the frame first, then shrinks with the closing wings to sit exactly over the bubble
      tl.fromTo("#clone", { scale: S * 1.3 }, { scale: S, duration: 0.38, ease: "expo.inOut", immediateRender: true }, BACK - 0.38);
      tl.fromTo("#clone span", { scale: 0.5, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.4, ease: "back.out(2)", immediateRender: true }, B3 + 0.3);
      tl.fromTo("#clone small", { y: 20, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3, ease: "power2.out", immediateRender: true }, B3 + 0.5);
      tl.fromTo("#clone .cup", { scale: 0 }, { scale: 1, duration: 0.35, ease: "back.out(2.5)", immediateRender: true }, B3 + 0.6);
      // the bubble now shows the last board, so the wings can close back onto it and the chat returns underneath
      gsap.set("#vb3", { opacity: 0 });
      tl.set("#vb3", { opacity: 1 }, B3 + 0.5);
      tl.set([".rb1", ".rb2"], { opacity: 0 }, B3 + 0.5);
      tl.fromTo("#wing3", { scaleX: 1 }, { scaleX: W0, duration: 0.38, ease: "expo.inOut", immediateRender: false }, BACK - 0.38);
      tl.set("#reel", { opacity: 0 }, BACK);

      tl.fromTo("#white", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power1.in", immediateRender: true }, DUR - 0.4);
      tl.to({}, { duration: 0.01 }, DUR - 0.01);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
