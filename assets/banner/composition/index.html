          "stroke-width": d.brush, "stroke-linecap": "round", "stroke-linejoin": "round", visibility: "hidden" }, g));

      }
      addRing("ringGear", "gear", 120);

      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const OFF = [[1, -0.6], [-0.8, 0.7], [0.55, 0.45], [-0.3, -0.35], [0.12, 0.1], [0, 0]];

      const dot = document.createElement("div"); dot.id = "painter";

        const L4 = FRAME_PATHS[name], seg = [0, 1, 2, 3].map((i) => i ? Math.hypot(L4[i][0] - L4[i - 1][0], L4[i][1] - L4[i - 1][1]) : 0);
        const tot = seg.reduce((a, b) => a + b, 0);

      const hop = { u: 0 }, topEnd = framePath.frameTop.at(1), T1 = T0 + 1.2;
