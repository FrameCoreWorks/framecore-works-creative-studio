name: Bug report
description: Something does not work as described
labels: [bug]
body:
  - type: dropdown
    id: host
    attributes:
      label: Where did you use it?
      options: [Claude Code, Claude app or Cowork, Codex, ChatGPT Work, Other]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Plugin version
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to repeat it
