name: Publish verified Studio release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - plugins/framecore-work-creative-studio/plugin.json
      - .github/workflows/release.yml

permissions:
  contents: write

concurrency:
  group: creative-studio-release
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'FrameCoreWorks/framecore-works-creative-studio'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0 (Node 24)
        with:
          persist-credentials: false
      - name: Install ffmpeg, numpy and Pillow for the media tests
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends ffmpeg
          python3 -m pip install --no-deps --only-binary :all: -r requirements-ci.txt
      - name: Check the package and isolated filesystem installer
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python3 -m pip install --no-deps -r requirements-gepa-pilot.txt
          bash scripts/check_all.sh
          python3 scripts/package_release.py
      - name: Upload, verify and publish the source commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: FrameCoreWorks/framecore-works-creative-studio
        run: python3 scripts/publish_github_release.py
