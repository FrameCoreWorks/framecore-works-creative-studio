name: Publish verified Studio release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - plugins/framecore-work-creative-studio/plugin.json
      - .github/workflows/release.yml

permissions:
  contents: write

concurrency:
  group: creative-studio-release
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'FrameCoreWorks/framecore-works-creative-studio'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Check the package and isolated filesystem installer
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python3 -m unittest discover -s tests -p 'test_codex_install.py' -v
          node --test --test-concurrency=1 plugins/framecore-work-creative-studio/tests/studio.test.mjs plugins/framecore-work-creative-studio/tests/workflow-kit.test.mjs plugins/framecore-work-creative-studio/tests/creative-upgrade.test.mjs plugins/framecore-work-creative-studio/tests/learning-mode.test.mjs plugins/framecore-work-creative-studio/tests/quality-methods.test.mjs plugins/framecore-work-creative-studio/tests/motion-toolkit.test.mjs
          python3 -m pip install --no-deps -r requirements-gepa-pilot.txt
          python3 -m unittest discover -s tests -p 'test_gepa_studio_pilot.py' -v
          python3 plugins/framecore-work-creative-studio/tests/asset_manifest_test.py
          python3 scripts/package_release.py
      - name: Upload, verify and publish the source commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: FrameCoreWorks/framecore-works-creative-studio
        run: python3 scripts/publish_github_release.py
