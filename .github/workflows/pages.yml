name: Publish the motion player to GitHub Pages

# Copies the single-file preview template, unchanged, to index.html on the gh-pages branch, with the bundled fonts in fonts/,
# and the example sound library (assets/sounds: listening page and MP3s) to sounds/.
# GitHub Pages must be enabled for that branch (Settings > Pages > Deploy from a branch > gh-pages, root).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - plugins/framecore-work-creative-studio/skills/hyperframes-workflow/assets/single-file-preview/motion-preview.html
      - plugins/framecore-work-creative-studio/skills/pipeline-core/assets/fonts/**
      - assets/sounds/index.html
      - assets/sounds/*.mp3
      - .github/workflows/pages.yml

permissions:
  contents: write

concurrency:
  group: motion-player-pages
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'FrameCoreWorks/framecore-works-creative-studio'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0 (Node 24)
        with:
          fetch-depth: 1
      - name: Update gh-pages with the current player and example sounds
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          player="$PWD/plugins/framecore-work-creative-studio/skills/hyperframes-workflow/assets/single-file-preview/motion-preview.html"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null; then
            git fetch --depth=1 origin gh-pages
            git worktree add -B gh-pages "$RUNNER_TEMP/site" FETCH_HEAD
          else
            git worktree add --orphan -b gh-pages "$RUNNER_TEMP/site"
          fi
          cd "$RUNNER_TEMP/site"
          cp "$player" index.html
          # The bundled fonts, so contracts that name them by file show the same type as the rendered MP4.
          rm -rf fonts && cp -R "$GITHUB_WORKSPACE/plugins/framecore-work-creative-studio/skills/pipeline-core/assets/fonts" fonts
          # The example sounds: the listening page and its MP3s, nothing else from assets/sounds.
          rm -rf sounds && mkdir sounds
          cp "$GITHUB_WORKSPACE/assets/sounds/index.html" "$GITHUB_WORKSPACE"/assets/sounds/*.mp3 sounds/
          touch .nojekyll
          git add -A index.html .nojekyll fonts sounds
          if git diff --cached --quiet; then
            echo 'The published player is already current.'
          else
            git commit -m "Publish the motion player from $SOURCE_SHA"
            git push origin gh-pages
          fi
