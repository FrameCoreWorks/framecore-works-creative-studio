name: Check Studio sources

# Runs on every push and pull request, separate from publication: the same checks as the release workflow
# (scripts/check_all.sh) with the renderer, critique and sound dependencies installed, plus the historical
# legacy suite compared with its recorded baseline (tests/legacy-baseline.json).
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0 (Node 24)
        with:
          persist-credentials: false
      - name: Install ffmpeg, numpy and Pillow for the media tests
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends ffmpeg
          python3 -m pip install --no-deps --only-binary :all: -r requirements-ci.txt
      - name: Current checks
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python3 -m pip install --no-deps -r requirements-gepa-pilot.txt
          bash scripts/check_all.sh
  legacy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0 (Node 24)
        with:
          persist-credentials: false
      - name: Historical legacy suite matches its recorded baseline (known failures stay known; any change fails)
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 scripts/check_legacy_baseline.py
