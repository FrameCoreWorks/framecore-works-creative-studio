name: Check Studio sources

# Runs on every push and pull request, separate from publication: the same checks as the release workflow
# (scripts/check_all.sh) with the renderer, critique and sound dependencies installed. The historical legacy suite
# was retired on 2026-10-10 (owner decision); tests/legacy-baseline.json is kept as history.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0 (Node 24)
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: A package change on main ships with a new version
        if: github.ref == 'refs/heads/main'
        run: python3 scripts/check_version_bump.py
      - name: Claude plugin and marketplace manifests validate (Claude Code CLI, no account needed)
        run: |
          npm install -g @anthropic-ai/claude-code@2.1.296
          claude plugin validate plugins/framecore-work-creative-studio --strict
          claude plugin validate . --strict
      - name: Install ffmpeg, numpy and Pillow for the media tests
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends ffmpeg
          python3 -m pip install --no-deps --only-binary :all: -r requirements-ci.txt
      - name: Current checks
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python3 -m pip install --no-deps -r requirements-gepa-pilot.txt
          bash scripts/check_all.sh
