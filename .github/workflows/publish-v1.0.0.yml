name: Publish verified Creative Studio v1.0.0

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-v1.0.0.yml

permissions:
  contents: write

concurrency:
  group: publish-creative-studio-v1.0.0
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'FrameCoreWorks/framecore-works-creative-studio'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify uploaded assets and publish the existing draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: FrameCoreWorks/framecore-works-creative-studio
        shell: python
        run: |
          import json
          import os
          import subprocess

          repo = os.environ["GH_REPO"]
          commit = "10954896e9bda73cf2dab01952a451b2a404fb59"
          tree = "afcbe6ccc73004f50bb1b175d78580da701b79d2"
          release_id = 398572778
          tag = "v1.0.0"
          expected = {
              "framecore-work-creative-studio-1.0.0.zip": "5463014ba430a1a792c1dcdd57ec4239fbb8789501dbc446ddb324e92e4bdef3",
              "framecore-work-creative-studio-1.0.0.zip.inventory.json": "73bf33fb86959bc114cc5e927ac604b70ee23677801543da3366acc1a0c1e358",
              "framecore-works-creative-studio-1.0.0-repository.zip": "d7fe2e3baefa33688a6a40267dbd4668c7d138920a23ac2acac502c81a094eab",
              "framecore-works-creative-studio-1.0.0-repository.zip.inventory.json": "25202d3319fbcb9dff24c17db58941347be66e13460bd09b787f0434368e3e3a",
              "SHA256SUMS.txt": "014df93bb6a2b94d77026f32a9bbe1ca6c629bfd948e3182f4b65e8d30c24f35",
          }

          def api(path, payload=None, missing_ok=False):
              command = ["gh", "api", f"repos/{repo}/{path}"]
              if payload is not None:
                  command += ["--method", "PATCH", "--input", "-"]
              result = subprocess.run(
                  command, input=json.dumps(payload) if payload is not None else None,
                  text=True, capture_output=True, timeout=30,
              )
              if result.returncode:
                  if missing_ok and "HTTP 404" in result.stderr:
                      return None
                  raise RuntimeError(result.stderr)
              return json.loads(result.stdout)

          def verify_assets(release):
              assert release["id"] == release_id
              assert release["tag_name"] == tag
              assert release["prerelease"] is False
              assets = release["assets"]
              assert len(assets) == len(expected), "Unexpected asset count"
              assert {a["name"] for a in assets} == set(expected), "Unexpected asset names"
              for asset in assets:
                  assert asset["state"] == "uploaded", asset["name"]
                  assert asset["digest"] == "sha256:" + expected[asset["name"]], asset["name"]

          assert api(f"git/commits/{commit}")["tree"]["sha"] == tree
          release = api(f"releases/{release_id}")
          verify_assets(release)
          existing_tag = api(f"git/ref/tags/{tag}", missing_ok=True)
          if existing_tag is not None:
              assert existing_tag["object"]["type"] == "commit"
              assert existing_tag["object"]["sha"] == commit, "Tag points to a different commit"

          if release["draft"]:
              release = api(f"releases/{release_id}", {
                  "tag_name": tag,
                  "target_commitish": commit,
                  "draft": False,
                  "prerelease": False,
                  "make_latest": "true",
              })

          assert release["draft"] is False
          assert release["published_at"]
          verify_assets(release)
          published_tag = api(f"git/ref/tags/{tag}")
          assert published_tag["object"]["type"] == "commit"
          assert published_tag["object"]["sha"] == commit
          print(json.dumps({
              "status": "PUBLISHED_AND_VERIFIED",
              "url": release["html_url"],
              "tag": tag,
              "commit": commit,
              "verified_assets": len(expected),
          }, indent=2))
