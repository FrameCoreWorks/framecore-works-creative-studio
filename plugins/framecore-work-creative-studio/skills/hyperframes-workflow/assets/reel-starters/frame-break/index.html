<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Display"; src: url("fonts/display.ttf"); font-display: block; }
      :root { --paper: #ffffff; --ink: #141414; --accent: #e8833a; --on-ink: #ffffff; --void: #141414; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--paper); }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: var(--paper); font-family: "Display", system-ui, sans-serif; color: var(--ink); }
      #cam { position: absolute; inset: 0; transform-origin: 50% 50%; }
      /* Back to front: the frame's void, the poster face as tiles, the frame border, the character (masked to the
         frame until the break, then free in front of the border), the copy. */
      #void { position: absolute; background: var(--void); }
      #face { position: absolute; background-repeat: no-repeat; background-size: 100% 100%; }
      .tile { position: absolute; background-repeat: no-repeat; backface-visibility: hidden; }
      #border { position: absolute; border: 14px solid var(--ink); }
      #char { position: absolute; transform-origin: 50% 100%; }
      #char img { width: 100%; height: 100%; object-fit: contain; object-position: 50% 100%; display: block; }
      /* Placeholder figure: flat shapes, never a realistic person. Replace with the client's cut-out (PNG with alpha). */
      .fig { position: absolute; left: 0; right: 0; bottom: 0; top: 0; }
      .fig i { position: absolute; display: block; background: var(--accent); }
      .copy { position: absolute; left: 90px; right: 90px; text-align: center; font-weight: 700; line-height: 1; opacity: 0; }
      #kicker { top: 250px; font-size: 52px; }
      #headline { top: 200px; font-size: 96px; line-height: 0.95; }
      #panel { position: absolute; left: 0; right: 0; bottom: 0; height: 1920px; background: var(--ink); transform-origin: 50% 100%; }
      #end { top: 860px; font-size: 92px; color: var(--on-ink); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="8.5" data-width="1080" data-height="1920">
      <div id="cam">
        <div id="void"></div>
        <div id="face"></div>
        <div id="tiles"></div>
        <div id="border"></div>
        <div id="char"></div>
      </div>
      <div class="copy" id="kicker" data-copy="kicker"></div>
      <div class="copy" id="headline" data-copy="headline"></div>
      <div id="panel"></div>
      <div class="copy" id="end" data-copy="endLine"></div>
    </div>
    <script>
      // Frame Break: a character steps out of a poster; the poster face cracks into tiles around the breach and the
      // character crosses in front of the frame border. Every value below is editable; motion is a pure function of
      // time (seek-safe) and the tile scatter comes from SEED.
      const COPY = { kicker: 'Kicker line', headline: 'Headline in two lines', endLine: 'End line' };
      const POSTER = '';     // relative path to the poster image, cropped to the frame ratio (700 x 940); empty = a flat placeholder
      const CUTOUT = '';     // relative path to the character cut-out, a PNG with real alpha; empty = flat placeholder figure
      const SEED = 7;
      const FRAME = { x: 190, y: 470, w: 700, h: 940 };              // the poster frame on the 1080 x 1920 stage
      const CHAR = { x: 300, y: 640, w: 480, h: 760 };               // the character box inside the frame, feet on the frame's bottom
      const GRID = { cols: 5, rows: 7 };
      const BREACH = { x: 540, y: 1380, radius: 520 };               // where the character crosses the frame; tiles near it fly
      // Times in seconds. Holds: the intact poster 0.8-2.2, the broken frame with the headline 3.6-6.4, the end line 6.9-8.5.
      const T = { enter: 0, settle: 0.8, crouch: 2.2, brk: 2.4, out: 3.0, head: 3.4, panel: 6.4, end: 6.9, dur: 8.5 };
      const STEP = { y: 230, scale: 1.3 };                           // how far the character steps out
      // Board windows (for the board plan and checks): intact poster, the break and headline, the end line.
      const BOARDS = [['#b1', 0, 3.0], ['#b2', 3.0, 6.4], ['#b3', 6.4, 8.5]];

      for (const el of document.querySelectorAll('[data-copy]')) el.textContent = COPY[el.dataset.copy] ?? '';
      const $ = id => document.getElementById(id);
      const place = (el, r) => Object.assign(el.style, { left: r.x + 'px', top: r.y + 'px', width: r.w + 'px', height: r.h + 'px' });
      place($('void'), FRAME); place($('face'), FRAME); place($('border'), { x: FRAME.x - 7, y: FRAME.y - 7, w: FRAME.w + 14, h: FRAME.h + 14 }); place($('char'), CHAR);
      const face = POSTER ? `url("${POSTER}")` : 'repeating-linear-gradient(135deg, #f2ede4 0 46px, #e6dfd2 46px 92px)';
      $('face').style.backgroundImage = face;

      if (CUTOUT) { const img = new Image(); img.src = CUTOUT; img.alt = ''; $('char').appendChild(img); }
      else {
        const fig = document.createElement('div'); fig.className = 'fig';
        // head, body, two legs: flat rounded shapes in the accent colour
        for (const [l, t, w, h, r] of [[37, 0, 26, 17, 50], [24, 18, 52, 46, 40], [28, 62, 18, 38, 9], [54, 62, 18, 38, 9]]) {
          const i = document.createElement('i');
          Object.assign(i.style, { left: l + '%', top: t + '%', width: w + '%', height: h + '%', borderRadius: r + '%' });
          fig.appendChild(i);
        }
        $('char').appendChild(fig);
      }

      // Seeded random (mulberry32): the same SEED gives the same crack every render.
      const rand = (() => { let a = SEED >>> 0; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; })();
      const tw = FRAME.w / GRID.cols, th = FRAME.h / GRID.rows, tiles = [];
      for (let r = 0; r < GRID.rows; r++) for (let c = 0; c < GRID.cols; c++) {
        const el = document.createElement('div'); el.className = 'tile';
        const x = FRAME.x + c * tw, y = FRAME.y + r * th;
        place(el, { x, y, w: tw + 1, h: th + 1 });   // 1 px overlap hides seams between tiles
        Object.assign(el.style, { backgroundImage: face, backgroundSize: `${FRAME.w}px ${FRAME.h}px`, backgroundPosition: `${-c * tw}px ${-r * th}px` });
        $('tiles').appendChild(el);
        const cx = x + tw / 2 - BREACH.x, cy = y + th / 2 - BREACH.y, d = Math.hypot(cx, cy);
        const flies = d < BREACH.radius;
        const k = flies ? 1 - d / BREACH.radius : 0;   // closer to the breach = faster and further
        tiles.push({ el, flies, dx: cx / (d || 1), dy: cy / (d || 1), dist: 260 + 520 * k * (0.6 + 0.4 * rand()), spin: (rand() * 2 - 1) * 160, delay: (1 - k) * 0.18 + rand() * 0.06, z: rand() });
      }

      const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
      const seg = (t, a, b) => clamp((t - a) / (b - a));
      const outExpo = u => u >= 1 ? 1 : 1 - Math.pow(2, -10 * u);
      const outCubic = u => 1 - Math.pow(1 - u, 3);
      const inOutCubic = u => u < 0.5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2;
      const inQuad = u => u * u;

      function draw(t) {
        // Camera: push in and hold, a short kick at the break, never a zoom-out inside a move.
        const push = 1 + 0.04 * seg(t, T.enter, T.crouch) + 0.035 * outExpo(seg(t, T.brk, T.out)) + 0.05 * seg(t, T.out, T.panel);
        const kick = t > T.brk && t < T.brk + 0.25 ? Math.sin((t - T.brk) * 90) * 10 * (1 - seg(t, T.brk, T.brk + 0.25)) : 0;
        gsap.set('#cam', { scale: push, y: 40 * (1 - outCubic(seg(t, T.enter, T.settle))) + kick });
        // Poster arrives.
        const enter = outCubic(seg(t, T.enter, T.settle));
        gsap.set(['#void', '#border'], { opacity: enter });
        // One whole poster face until the break, then the same picture as tiles (their seams read as the crack).
        gsap.set('#face', { opacity: t < T.brk ? enter : 0 });
        gsap.set('#tiles', { opacity: t < T.brk ? 0 : 1 });
        // Character: inside the frame (clipped to it) until the break, then steps out in front of the border.
        const crouch = Math.sin(Math.PI * seg(t, T.crouch, T.brk)) * 0.04;
        const step = outExpo(seg(t, T.brk, T.out));
        const breath = 0.012 * Math.sin(t * Math.PI * 1.6);
        gsap.set('#char', { opacity: enter, y: STEP.y * step, scaleY: 1 - crouch + breath + (STEP.scale - 1) * step, scaleX: 1 + crouch * 0.5 + (STEP.scale - 1) * step, rotation: 1.2 * Math.sin(t * Math.PI * 0.8) * step });
        const free = t >= T.brk;
        const cl = FRAME.x - CHAR.x, ct = FRAME.y - CHAR.y;
        $('char').style.clipPath = free ? 'none' : `inset(${ct}px ${CHAR.w - cl - FRAME.w}px ${CHAR.h - ct - FRAME.h}px ${cl}px)`;
        // Tiles near the breach fly outward and fall; the rest of the poster stays.
        for (const p of tiles) {
          if (!p.flies) { gsap.set(p.el, { x: 0, y: 0, rotation: 0, opacity: 1 }); continue; }
          const u = seg(t, T.brk + p.delay, T.brk + p.delay + 0.9);
          const e = outCubic(u);
          gsap.set(p.el, { x: p.dx * p.dist * e, y: p.dy * p.dist * e + 420 * inQuad(u), rotation: p.spin * e, opacity: 1 - seg(u, 0.55, 1), scale: 1 - 0.25 * e });
        }
        // Copy: kicker over the intact poster, headline after the break, end line on its own board.
        const k = outCubic(seg(t, 0.4, 0.9)) * (1 - seg(t, T.out, T.out + 0.25));
        gsap.set('#kicker', { opacity: k, y: 30 * (1 - outCubic(seg(t, 0.4, 0.9))) });
        const h = outCubic(seg(t, T.head, T.head + 0.45)) * (1 - seg(t, T.panel - 0.3, T.panel));
        gsap.set('#headline', { opacity: h, y: 50 * (1 - outCubic(seg(t, T.head, T.head + 0.45))) });
        gsap.set('#panel', { scaleY: inOutCubic(seg(t, T.panel, T.panel + 0.45)) });
        gsap.set('#end', { opacity: outCubic(seg(t, T.end, T.end + 0.4)), y: 40 * (1 - outCubic(seg(t, T.end, T.end + 0.4))), scale: 1 + 0.06 * seg(t, T.end, T.dur) });
      }

      const tl = gsap.timeline({ paused: true });
      // The clock's setter draws the frame, so every seek renders it, with or without timeline events.
      const clock = { _t: 0, get t() { return this._t; }, set t(v) { this._t = v; draw(v); } };
      tl.fromTo(clock, { t: 0 }, { t: T.dur, duration: T.dur, ease: 'none', immediateRender: true }, 0);
      window.__timelines = window.__timelines || {};
      window.__timelines['main'] = tl;
      draw(0);
      tl.seek(0);
    </script>
  </body>
</html>
