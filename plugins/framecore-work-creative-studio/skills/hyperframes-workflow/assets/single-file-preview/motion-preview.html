<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Motion preview</title>
<!--
  Single-file motion preview from the FrameCore Works Creative Studio Motion Graphics Workflow.
  Self-contained: no network, no libraries, no build step. Save as .html and open in a browser.
  Scenes are declared in the motion score by kind; the embedded scene engine computes every
  visual state from the frame number, so play, scrub, step and seekFrame() always show the
  same picture for the same frame. This is a preview, not a video export.
-->
<style>
  html, body { margin: 0; height: 100%; background: #1b1c1f; color: #e8eaed; font: 14px system-ui, sans-serif; }
  #viewport { position: relative; width: 100vw; height: calc(100vh - 64px); overflow: hidden; }
  #stage { position: absolute; left: 50%; top: 50%; transform-origin: 0 0; overflow: hidden; }
  #controls { display: flex; gap: 10px; align-items: center; height: 64px; padding: 0 16px; box-sizing: border-box; }
  #scrub { flex: 1; }
  button { font: inherit; }
</style>
</head>
<body>
<div id="viewport"><div id="stage"></div></div>
<div id="controls">
  <button id="play" type="button">Play</button>
  <button id="replay" type="button">Replay</button>
  <button id="back" type="button" aria-label="Previous frame">&lt;</button>
  <button id="next" type="button" aria-label="Next frame">&gt;</button>
  <input id="scrub" type="range" min="0" value="0" step="1" aria-label="Frame">
  <output id="readout">frame 0</output>
  <select id="format" aria-label="Format" hidden></select>
</div>

<!-- The motion contract. Replace it with the approved project score; scenes declare a kind and params. -->

<script>
(() => {
'use strict';
// BEGIN motion-scenes engine (copy of motion-scenes.mjs without export keywords)
// Declarative motion scene engine for the FrameCore Works Creative Studio motion contract.
// Dependency-free and runtime-agnostic: buildScene() describes the elements of a scene once,
// sceneFrame() returns their styles (and changing text) for one frame. DOM and React
// renderers only apply the result, so every runtime shows the same picture for a frame.
// Values follow references/motion-craft.md. Keep copies of this file byte-identical.

const bezier = (x1, y1, x2, y2) => x => {
  if (x <= 0 || x >= 1) return Math.min(1, Math.max(0, x));
  let lo = 0, hi = 1, u = x;
  for (let i = 0; i < 30; i++) {
    u = (lo + hi) / 2;
    const bx = 3 * (1 - u) * (1 - u) * u * x1 + 3 * (1 - u) * u * u * x2 + u * u * u;
    if (bx < x) lo = u; else hi = u;
  }
  return 3 * (1 - u) * (1 - u) * u * y1 + 3 * (1 - u) * u * u * y2 + u * u * u;
};

const easings = {
  easeOutCubic: bezier(0.33, 1, 0.68, 1),
  easeOutQuart: bezier(0.25, 1, 0.5, 1),
  easeOutExpo: bezier(0.16, 1, 0.3, 1),
  easeInOutCubic: bezier(0.65, 0, 0.35, 1),
  easeInCubic: bezier(0.32, 0, 0.67, 0),
  linear: x => Math.min(1, Math.max(0, x)),
};

/** Supported scene kinds and the params each one requires. */
const sceneKinds = {
  'line-reveal': {required: ['lines'], copyParams: ['lines']},
  'item-stagger': {required: ['items'], copyParams: ['items']},
  'end-card': {required: ['text'], copyParams: ['text']},
  'counter': {required: ['to'], copyParams: ['label']},
  'quote': {required: ['quote'], copyParams: ['quote', 'attribution']},
  'logo-reveal': {required: ['asset'], copyParams: []},
};

/** Eased 0..1 progress of an interval starting at master frame `start` and lasting `duration` frames. */
const progress = (frame, start, duration, easing = 'linear') => easings[easing]((frame - start) / duration);

// Sizes are authored for a 1080 px short side, so 16:9, 9:16 and 1:1 share one type scale.
const scale = score => Math.min(score.width, score.height) / 1080;
const px = (score, value) => Math.round(value * scale(score));
const motion = score => ({entryFrames: 15, exitFrames: 10, lineStaggerFrames: 6, itemStaggerFrames: 8, entryEasing: 'easeOutCubic', exitEasing: 'easeInCubic', resolveEasing: 'easeOutExpo', ...score.motion});
const margin = score => Math.round(score.width * (score.tokens?.marginRatio ?? 0.08));
const list = value => (Array.isArray(value) ? value : value === undefined ? [] : [value]);
const copy = (score, id) => score.copy?.[id] ?? '';
const isLast = (scene, score) => scene.end >= score.totalFrames;

// Optional tokens.safeArea {top, bottom} (fractions of the height) keeps content clear of platform UI.
// Take the values from the platform's current documentation or the user; the engine has no defaults.
const padding = score => {
  const area = score.tokens?.safeArea;
  if (!area) return `0 ${margin(score)}px`;
  return `${Math.round(score.height * (area.top ?? 0))}px ${margin(score)}px ${Math.round(score.height * (area.bottom ?? 0))}px`;
};
const column = (score, align = 'left') => ({
  position: 'absolute', inset: '0', display: 'flex', flexDirection: 'column', justifyContent: 'center',
  alignItems: align === 'center' ? 'center' : 'stretch', padding: padding(score), boxSizing: 'border-box',
});
// item-stagger direction: 'row', 'column' or 'auto' (a row only in clearly landscape frames).
const vertical = (scene, score) => {
  const direction = scene.params?.direction ?? 'auto';
  return direction === 'column' || (direction === 'auto' && score.width < score.height * 1.3);
};

/** The score in one output format: size, tokens and scene params of score.formats[id] merged over the base. */
function resolveFormat(score, id) {
  if (id === undefined || id === null || id === '' || id === 'base') return score;
  const format = (score.formats ?? []).find(item => item.id === id);
  if (!format) throw new Error(`Unknown format: ${id}`);
  const params = format.params ?? {};
  return {...score, format: format.id, width: format.width, height: format.height, viewing: format.viewing ?? score.viewing,
    tokens: {...score.tokens, ...format.tokens},
    scenes: score.scenes.map(scene => (params[scene.id] ? {...scene, params: {...scene.params, ...params[scene.id]}} : scene))};
}

/** Describe the scene's elements. Each node: {key, type: 'box' | 'text' | 'image', text?, src?, style, children?}. */
function buildScene(scene, score) {
  const p = scene.params ?? {}, t = score.tokens ?? {};
  switch (scene.kind) {
    case 'line-reveal': {
      const sizes = p.sizes ?? [132, 96], weights = p.weights ?? [700, 400];
      return {key: 'container', type: 'box', style: column(score, p.align), children: list(p.lines).map((id, i) => ({
        key: `mask-${i}`, type: 'box', style: {overflow: 'hidden', lineHeight: '1.1'},
        children: [{key: `line-${i}`, type: 'text', text: copy(score, id), style: {fontSize: `${px(score, sizes[i] ?? sizes[sizes.length - 1])}px`, fontWeight: String(weights[i] ?? weights[weights.length - 1])}}],
      }))};
    }
    case 'item-stagger': {
      const items = list(p.items).map((id, i) => ({key: `item-${i}`, type: 'text', text: copy(score, id), style: {position: 'relative', padding: `${px(score, 12)}px ${px(score, 36)}px`, background: t.background, fontSize: `${px(score, p.size ?? 104)}px`, fontWeight: String(p.weight ?? 700)}}));
      const down = vertical(scene, score);
      const row = {key: 'row', type: 'box', children: items, style: down
        ? {position: 'relative', display: 'flex', flexDirection: 'column', alignItems: 'center', gap: `${px(score, p.gap ?? 56)}px`}
        : {position: 'relative', display: 'flex', justifyContent: 'space-between', alignItems: 'center'}};
      const line = down
        ? {position: 'absolute', top: '0', bottom: '0', left: `calc(50% - ${px(score, 3)}px)`, width: `${px(score, 6)}px`, background: t.accent, transformOrigin: 'center top'}
        : {position: 'absolute', left: '0', right: '0', top: '50%', height: `${px(score, 6)}px`, background: t.accent, transformOrigin: 'left center'};
      if (p.connector !== false) row.children = [{key: 'connector', type: 'box', style: line}, ...items];
      return {key: 'container', type: 'box', style: column(score), children: [row]};
    }
    case 'end-card':
      return {key: 'container', type: 'box', style: column(score, 'center'), children: [
        {key: 'text', type: 'text', text: copy(score, p.text), style: {fontSize: `${px(score, p.size ?? 120)}px`, fontWeight: String(p.weight ?? 700), textAlign: 'center'}},
        ...(p.rule === false ? [] : [{key: 'rule', type: 'box', style: {marginTop: `${px(score, 28)}px`, height: `${px(score, 6)}px`, width: `${px(score, 160)}px`, background: t.accent, transformOrigin: 'center'}}]),
      ]};
    case 'counter':
      return {key: 'container', type: 'box', style: column(score, p.align ?? 'center'), children: [
        {key: 'number', type: 'text', text: '', style: {fontSize: `${px(score, p.size ?? 220)}px`, fontWeight: '700', lineHeight: '1', fontVariantNumeric: 'tabular-nums'}},
        ...(p.label ? [{key: 'label', type: 'text', text: copy(score, p.label), style: {marginTop: `${px(score, 24)}px`, fontSize: `${px(score, p.labelSize ?? 48)}px`, color: t.muted ?? t.foreground}}] : []),
      ]};
    case 'quote':
      return {key: 'container', type: 'box', style: column(score, p.align ?? 'left'), children: [
        {key: 'quote', type: 'text', text: copy(score, p.quote), style: {maxWidth: '78%', fontSize: `${px(score, p.size ?? 72)}px`, lineHeight: '1.25', fontWeight: '400'}},
        ...(p.attribution ? [{key: 'attribution', type: 'text', text: copy(score, p.attribution), style: {marginTop: `${px(score, 36)}px`, fontSize: `${px(score, 40)}px`, color: t.muted ?? t.foreground}}] : []),
      ]};
    case 'logo-reveal': {
      const asset = (score.assets ?? []).find(item => item.id === p.asset);
      return {key: 'container', type: 'box', style: column(score, 'center'), children: [
        {key: 'logo', type: 'image', src: asset?.src ?? '', alt: asset?.alt ?? asset?.id ?? '', style: {width: `${px(score, p.width ?? 360)}px`, height: 'auto', display: 'block'}},
      ]};
    }
    default:
      throw new Error(`Unknown scene kind: ${scene.kind}`);
  }
}

/** Styles and changing text for one frame: {key: {style, text?}}. The scene is visible when start <= frame < end. */
function sceneFrame(scene, score, frame) {
  const p = scene.params ?? {}, m = motion(score), out = {};
  const exits = p.exit ?? !isLast(scene, score);
  const e = exits ? progress(frame, scene.end - m.exitFrames, m.exitFrames, m.exitEasing) : 0;
  out.container = {style: {opacity: String(1 - e), transform: `translateY(${-px(score, 24) * e}px)`}};
  switch (scene.kind) {
    case 'line-reveal':
      list(p.lines).forEach((_, i) => {
        const k = progress(frame, scene.start + i * m.lineStaggerFrames, m.entryFrames, m.entryEasing);
        out[`line-${i}`] = {style: {transform: `translateY(${(1 - k) * 110}%)`}};
      });
      break;
    case 'item-stagger': {
      const n = list(p.items).length, lastEntryEnd = scene.start + (n - 1) * m.itemStaggerFrames + m.entryFrames;
      if (p.connector !== false) out.connector = {style: {transform: `${vertical(scene, score) ? 'scaleY' : 'scaleX'}(${progress(frame, scene.start + 6, lastEntryEnd - scene.start - 6, 'linear')})`}};
      for (let i = 0; i < n; i++) {
        const k = progress(frame, scene.start + i * m.itemStaggerFrames, m.entryFrames, m.entryEasing);
        out[`item-${i}`] = {style: {opacity: String(k), transform: `translateY(${(1 - k) * px(score, 32)}px)`}};
      }
      break;
    }
    case 'end-card': {
      const k = progress(frame, scene.start, p.duration ?? 30, m.resolveEasing);
      out.text = {style: {opacity: String(k), transform: `scale(${0.94 + 0.06 * k})`}};
      if (p.rule !== false) out.rule = {style: {transform: `scaleX(${k})`}};
      break;
    }
    case 'counter': {
      // The label and unit settle first; the number counts only once they are readable.
      const label = progress(frame, scene.start, m.entryFrames, m.entryEasing);
      const k = progress(frame, scene.start + m.entryFrames, p.duration ?? 45, p.easing ?? 'easeOutCubic');
      const value = (p.from ?? 0) + ((p.to ?? 0) - (p.from ?? 0)) * k;
      const format = new Intl.NumberFormat(p.locale ?? 'en-US', {minimumFractionDigits: p.decimals ?? 0, maximumFractionDigits: p.decimals ?? 0});
      out.number = {style: {opacity: String(label)}, text: `${p.prefix ?? ''}${format.format(value)}${p.suffix ?? ''}`};
      if (p.label) out.label = {style: {opacity: String(label), transform: `translateY(${(1 - label) * px(score, 16)}px)`}};
      break;
    }
    case 'quote': {
      // Whole-phrase reveal; the attribution follows once the quotation has settled.
      const k = progress(frame, scene.start, m.entryFrames + 5, m.entryEasing);
      out.quote = {style: {opacity: String(k), transform: `translateY(${(1 - k) * px(score, 24)}px)`}};
      if (p.attribution) out.attribution = {style: {opacity: String(progress(frame, scene.start + (p.attributionDelay ?? 30), m.entryFrames, m.entryEasing))}};
      break;
    }
    case 'logo-reveal': {
      // Reveal by clipping only: the mark is never scaled, skewed or recoloured.
      const k = progress(frame, scene.start, p.duration ?? 30, m.resolveEasing);
      out.logo = {style: {clipPath: p.reveal === 'wipe' ? `inset(0 ${(1 - k) * 100}% 0 0)` : `circle(${k * 75}% at 50% 50%)`}};
      break;
    }
    default:
      throw new Error(`Unknown scene kind: ${scene.kind}`);
  }
  return out;
}

/** Beat grid from score.music {bpm, offsetMs, beatsPerBar}: every beat inside the timeline as {beat, bar, beatInBar, frame}. */
function beatFrames(score) {
  const music = score.music;
  if (!(music?.bpm > 0)) return [];
  const fps = score.fps.num / score.fps.den, perBar = music.beatsPerBar ?? 4, offset = (music.offsetMs ?? 0) / 1000, beats = [];
  // Each beat is computed from the master timeline, so rounding never accumulates.
  for (let beat = 0, frame = Math.round(offset * fps); frame < score.totalFrames; beat++, frame = Math.round((offset + beat * 60 / music.bpm) * fps)) {
    beats.push({beat, bar: Math.floor(beat / perBar) + 1, beatInBar: (beat % perBar) + 1, frame});
  }
  return beats;
}

/** Caption layer for score.captions [{id, start, end, copy}], drawn above the scenes; null without captions. */
function buildCaptions(score) {
  if (!score.captions?.length) return null;
  const t = score.tokens ?? {}, c = t.captions ?? {};
  const bottom = Math.max(Math.round(score.height * (t.safeArea?.bottom ?? 0)), Math.round(score.height * (c.bottom ?? 0.08)));
  return {key: 'captions', type: 'box', style: {position: 'absolute', left: `${margin(score)}px`, right: `${margin(score)}px`, bottom: `${bottom}px`, display: 'flex', justifyContent: 'center'}, children: [
    {key: 'caption', type: 'text', text: '', style: {maxWidth: '100%', padding: `${px(score, 10)}px ${px(score, 22)}px`, background: c.background ?? 'rgba(0, 0, 0, 0.8)', color: c.color ?? '#FFFFFF', fontSize: `${px(score, c.size ?? 44)}px`, lineHeight: '1.3', fontWeight: String(c.weight ?? 500), textAlign: 'center', whiteSpace: 'pre-line', borderRadius: `${px(score, 6)}px`}},
  ]};
}

/** The caption shown at a frame: captions cut in and out on their exact frames, start <= frame < end. */
function captionsFrame(score, frame) {
  const caption = (score.captions ?? []).find(item => frame >= item.start && frame < item.end);
  return {captions: {style: {visibility: caption ? 'visible' : 'hidden'}}, caption: {text: caption ? copy(score, caption.copy) : ''}};
}

/** Index a built scene tree by key. */
function nodesByKey(node, map = {}) {
  map[node.key] = node;
  for (const child of node.children ?? []) nodesByKey(child, map);
  return map;
}
// END motion-scenes engine

  // ?format=9x16 shows one of score.formats; without it the base format is shown.
  const query = new URLSearchParams(location.search);
  const contract = JSON.parse(document.getElementById('motion-score').textContent);
  const score = resolveFormat(contract, query.get('format') || undefined);
  const fps = score.fps.num / score.fps.den, N = score.totalFrames, t = score.tokens || {};
  const stage = document.getElementById('stage');
  Object.assign(stage.style, {width: score.width + 'px', height: score.height + 'px', background: t.background, color: t.foreground, fontFamily: t.fontFamily});

  // Generic DOM renderer: build each scene's element tree once, then apply per-frame styles.
  const create = (node, elements, texts = []) => {
    const el = document.createElement(node.type === 'image' ? 'img' : 'div');
    Object.assign(el.style, node.style || {});
    if (node.type === 'text') el.textContent = node.text;
    if (node.type === 'image') { el.src = node.src; el.alt = node.alt || ''; }
    for (const child of node.children || []) el.append(create(child, elements, texts));
    elements[node.key] = el;
    if (node.type === 'text') texts.push({key: node.key, el});
    return el;
  };
  const scenes = score.scenes.map(scene => {
    const elements = {}, texts = [], root = create(buildScene(scene, score), elements, texts);
    root.style.visibility = 'hidden';
    stage.append(root);
    return {scene, root, elements, texts};
  });
  // Captions sit above every scene and cut on their exact frames.
  const captionTree = buildCaptions(score), captionElements = {}, captionTexts = [];
  if (captionTree) stage.append(create(captionTree, captionElements, captionTexts));

  /** Draw exactly one frame. Visible scenes satisfy start <= frame < end. */
  function renderFrame(frame) {
    for (const {scene, root, elements} of scenes) {
      const active = frame >= scene.start && frame < scene.end;
      root.style.visibility = active ? 'visible' : 'hidden';
      if (!active) continue;
      for (const [key, value] of Object.entries(sceneFrame(scene, score, frame))) {
        const el = elements[key];
        if (!el) continue;
        Object.assign(el.style, value.style || {});
        if (value.text !== undefined) el.textContent = value.text;
      }
    }
    if (captionTree) for (const [key, value] of Object.entries(captionsFrame(score, frame))) {
      Object.assign(captionElements[key].style, value.style || {});
      if (value.text !== undefined) captionElements[key].textContent = value.text;
    }
  }

  // Optional music and voice-over files (src next to this file). While they play, the audio clock
  // chooses the frame, so picture and sound stay together; otherwise the system clock does.
  const tracks = [score.music, score.voiceover].filter(track => track && track.src).map(track => {
    const audio = new Audio(track.src); audio.preload = 'auto'; audio.volume = track.volume ?? 1; return audio;
  });

  // Player: the clock only chooses which frame to draw.
  const scrub = document.getElementById('scrub'), readout = document.getElementById('readout'), play = document.getElementById('play');
  scrub.max = String(N - 1);
  let current = 0, playing = false, startedAt = 0, startFrame = 0;
  function seekFrame(frame) {
    current = Math.min(N - 1, Math.max(0, Math.round(Number(frame) || 0)));
    renderFrame(current);
    scrub.value = String(current);
    readout.textContent = `frame ${current} / ${N - 1}`;
    return current;
  }
  const stop = () => { playing = false; play.textContent = 'Play'; for (const audio of tracks) audio.pause(); };
  function tick(now) {
    if (!playing) return;
    const lead = tracks.find(audio => !audio.paused && audio.readyState >= 2);
    const frame = lead ? Math.floor(lead.currentTime * fps) : startFrame + Math.floor((now - startedAt) / 1000 * fps);
    seekFrame(frame);
    if (frame >= N - 1) { stop(); return; }
    requestAnimationFrame(tick);
  }
  play.onclick = () => {
    if (playing) { stop(); return; }
    playing = true; play.textContent = 'Pause';
    startFrame = current >= N - 1 ? 0 : current; startedAt = performance.now();
    for (const audio of tracks) { audio.currentTime = startFrame / fps; audio.play().catch(() => {}); }
    requestAnimationFrame(tick);
  };
  document.getElementById('replay').onclick = () => { stop(); seekFrame(0); play.click(); };
  document.getElementById('back').onclick = () => { stop(); seekFrame(current - 1); };
  document.getElementById('next').onclick = () => { stop(); seekFrame(current + 1); };
  scrub.oninput = () => { stop(); seekFrame(scrub.value); };
  addEventListener('keydown', event => {
    if (event.key === ' ') { event.preventDefault(); play.click(); }
    if (event.key === 'ArrowLeft') { stop(); seekFrame(current - 1); }
    if (event.key === 'ArrowRight') { stop(); seekFrame(current + 1); }
  });

  const fit = () => {
    // Review mode draws the stage at its true size from the top-left corner, whatever the window size.
    if (new URLSearchParams(location.search).has('review')) { Object.assign(stage.style, {left: '0', top: '0', transform: 'none'}); return; }
    const viewport = document.getElementById('viewport');
    const s = Math.min(viewport.clientWidth / score.width, viewport.clientHeight / score.height);
    stage.style.transform = `scale(${s}) translate(-50%, -50%)`;
  };
  addEventListener('resize', fit);
  fit();
  // Format switcher: shown only when the contract declares formats; reloads with ?format=.
  const picker = document.getElementById('format');
  if ((contract.formats || []).length) {
    for (const f of [{id: 'base', width: contract.width, height: contract.height}, ...contract.formats]) picker.append(new Option(`${f.id} (${f.width}x${f.height})`, f.id, false, f.id === (score.format || 'base')));
    picker.hidden = false;
    picker.onchange = () => { query.set('format', picker.value); query.set('frame', String(current)); location.search = query.toString(); };
  }
  window.seekFrame = seekFrame;
  window.motionScore = score;

  // Review mode (?review=1): measure settled text during readable holds and publish a report.
  // Checks: outside the frame, inside the margin, WCAG contrast, overlapping text, partial opacity
  // in a hold and, for vertical formats, small text. Frames outside holds are reported as not checked.
  const rgb = value => (value.match(/[\d.]+/g) || []).map(Number);
  const luminance = ([r, g, b]) => [r, g, b].map(c => { c /= 255; return c <= 0.03928 ? c / 12.92 : ((c + 0.055) / 1.055) ** 2.4; }).reduce((sum, c, i) => sum + c * [0.2126, 0.7152, 0.0722][i], 0);
  const contrast = (a, b) => { const [x, y] = [luminance(a), luminance(b)].sort((p, q) => q - p); return (x + 0.05) / (y + 0.05); };
  const backgroundOf = el => { for (let node = el; node && node !== document.body; node = node.parentElement) { const c = getComputedStyle(node).backgroundColor; const v = rgb(c); if (v.length >= 3 && (v.length < 4 || v[3] > 0)) return v.slice(0, 3); } return rgb(getComputedStyle(stage).backgroundColor).slice(0, 3); };
  const opacityOf = el => { let o = 1; for (let node = el; node && node !== stage.parentElement; node = node.parentElement) o *= Number(getComputedStyle(node).opacity); return o; };
  function reviewFrame(frame) {
    seekFrame(frame);
    const issues = [], s = stage.getBoundingClientRect(), k = s.width / score.width;
    const marginX = score.width * (t.marginRatio ?? 0.08), marginY = score.height * (t.marginRatio ?? 0.08) * 0.5;
    const top = Math.max(marginY, score.height * (t.safeArea?.top ?? 0)), bottom = Math.max(marginY, score.height * (t.safeArea?.bottom ?? 0));
    let held = false;
    const measure = (sceneId, key, el, boxes) => {
      if (!el.textContent.trim()) return;
      // Horizontal extent from the rendered glyphs (catches overflowing words); vertical extent from
      // the line box, because glyph boxes include ascender/descender space beyond tight line heights.
      const range = document.createRange(); range.selectNodeContents(el);
      const rects = [...range.getClientRects()].filter(q => q.width > 0 && q.height > 0);
      if (!rects.length) return;
      const line = el.getBoundingClientRect();
      const r = {left: Math.min(...rects.map(q => q.left)), top: line.top, right: Math.max(...rects.map(q => q.right)), bottom: line.bottom};
      const box = {left: (r.left - s.left) / k, top: (r.top - s.top) / k, right: (r.right - s.left) / k, bottom: (r.bottom - s.top) / k};
      const style = getComputedStyle(el), size = parseFloat(style.fontSize), bold = Number(style.fontWeight) >= 700;
      const add = (severity, check, detail) => issues.push({severity, check, scene: sceneId, element: key, detail});
      for (let node = el.parentElement; node && node !== stage; node = node.parentElement) {
        if (getComputedStyle(node).overflow !== 'hidden') continue;
        const c = node.getBoundingClientRect();
        if (r.left < c.left - 0.5 || r.top < c.top - 0.5 || r.right > c.right + 0.5 || r.bottom > c.bottom + 0.5) { add('error', 'clipped', 'text extends beyond a clipping mask during a readable hold'); break; }
      }
      if (box.left < 0 || box.top < 0 || box.right > score.width || box.bottom > score.height) add('error', 'outside-frame', `text box ${Math.round(box.left)},${Math.round(box.top)} to ${Math.round(box.right)},${Math.round(box.bottom)} leaves the ${score.width}x${score.height} frame`);
      else if (box.left < marginX - 0.5 || box.right > score.width - marginX + 0.5 || box.top < top - 0.5 || box.bottom > score.height - bottom + 0.5) add('warning', 'margin', `text is closer to the edge than the ${Math.round(marginX)} px side, ${Math.round(top)} px top or ${Math.round(bottom)} px bottom margin or safe area`);
      const ratio = contrast(rgb(style.color).slice(0, 3), backgroundOf(el)), large = size >= 24 || (bold && size >= 18.66);
      if (ratio < (large ? 3 : 4.5)) add('error', 'contrast', `contrast ${ratio.toFixed(2)}:1 is below WCAG ${large ? '3' : '4.5'}:1 for ${large ? 'large' : 'normal'} text`);
      const opacity = opacityOf(el);
      if (opacity < 0.99) add('warning', 'hold-opacity', `text opacity is ${opacity.toFixed(2)} during a readable hold`);
      if (score.height > score.width && size < score.height / 48) add('warning', 'small-text', `${Math.round(size)} px text may be hard to read on a phone`);
      for (const other of boxes) if (box.left < other.box.right && other.box.left < box.right && box.top < other.box.bottom && other.box.top < box.bottom) add('warning', 'overlap', `overlaps ${other.key}`);
      boxes.push({key, box});
    };
    const sceneBoxes = [];
    for (const {scene, texts} of scenes) {
      if (!(frame >= scene.start && frame < scene.end)) continue;
      if (!(scene.holds || []).some(([a, b]) => frame >= a && frame < b)) continue;
      held = true;
      const boxes = [];
      for (const {key, el} of texts) measure(scene.id, key, el, boxes);
      sceneBoxes.push(...boxes);
    }
    // A caption is meant to be read for its whole interval, so it is measured whenever it is shown,
    // including overlap with settled scene text.
    if (captionTree && captionTexts.some(({el}) => el.textContent.trim())) {
      held = true;
      for (const {key, el} of captionTexts) measure('captions', key, el, [...sceneBoxes]);
    }
    return {frame, checked: held, issues};
  }
  window.reviewFrame = reviewFrame;

  // ?frame=140 opens one frame; ?frames=299,0,140 replays a seek sequence for review comparisons.
  if (query.has('review')) {
    document.getElementById('controls').style.display = 'none';
    Object.assign(document.getElementById('viewport').style, {width: score.width + 'px', height: score.height + 'px'});
    document.documentElement.style.background = document.body.style.background = t.background || '#000';
    fit();
  }
  for (const frame of (query.get('frames') || query.get('frame') || '0').split(',')) seekFrame(frame);
  if (query.has('review')) {
    const report = document.createElement('script');
    report.type = 'application/json'; report.id = 'review-report';
    report.textContent = JSON.stringify({id: score.id, revision: score.revision, format: score.format || 'base', width: score.width, height: score.height, ...reviewFrame(current)});
    document.body.append(report);
  }
  document.documentElement.dataset.ready = 'true';
})();
</script>
</body>
</html>
