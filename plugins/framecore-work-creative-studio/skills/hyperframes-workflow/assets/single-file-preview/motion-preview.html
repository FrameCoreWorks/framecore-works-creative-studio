<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Motion preview</title>
<!--
  Single-file motion preview from the FrameCore Works Creative Studio Motion Graphics Workflow.
  Self-contained: no network, no libraries, no build step. Save as .html and open in a browser.
  Scenes are declared in the motion score by kind; the embedded scene engine computes every
  visual state from the frame number, so play, scrub, step and seekFrame() always show the
  same picture for the same frame. This is a preview, not a video export.
-->
<style>
  html, body { margin: 0; height: 100%; background: #1b1c1f; color: #e8eaed; font: 14px system-ui, sans-serif; }
  #viewport { position: relative; width: 100vw; height: calc(100vh - 64px); overflow: hidden; }
  #stage { position: absolute; left: 50%; top: 50%; transform-origin: 0 0; overflow: hidden; }
  #controls { display: flex; gap: 10px; align-items: center; height: 64px; padding: 0 16px; box-sizing: border-box; }
  #scrub { flex: 1; }
  button { font: inherit; }
</style>
</head>
<body>
<div id="viewport"><div id="stage"></div></div>
<div id="controls">
  <button id="play" type="button">Play</button>
  <button id="replay" type="button">Replay</button>
  <button id="back" type="button" aria-label="Previous frame">&lt;</button>
  <button id="next" type="button" aria-label="Next frame">&gt;</button>
  <input id="scrub" type="range" min="0" value="0" step="1" aria-label="Frame">
  <output id="readout">frame 0</output>
</div>

<!-- The motion contract. Replace it with the approved project score; scenes declare a kind and params. -->
<script type="application/json" id="motion-score">
{
  "schema_version": 1,
  "id": "kinetic-type-starter",
  "revision": 1,
  "approval": {
    "status": "example-not-client-approved",
    "revision": null,
    "evidence": null
  },
  "stage": "build",
  "goal": "Show how a short kinetic typography statement is planned, built and reviewed from one contract",
  "audience": "Studio users learning code-based motion graphics",
  "message": "Clear motion starts with one idea",
  "concept": "Each scene reveals one part of the statement: the idea, the three steps that realize it, and a calm resolved ending",
  "runtime": {
    "status": "proposed",
    "value": "Remotion kinetic type starter or GSAP motion starter; single-file preview where no renderer exists"
  },
  "viewing": "16:9 on a laptop or larger screen",
  "audio": "intentional silence",
  "decisions": {
    "confirmed": [
      "1920 x 1080, 30 FPS, 300 frames",
      "Exact illustrative copy in the copy ledger"
    ],
    "proposed": [
      "Arial as an illustrative system font",
      "Accent colour #FF5A36"
    ],
    "unknown": [
      "Final brand font and colours for a real project"
    ]
  },
  "fps": {
    "num": 30,
    "den": 1
  },
  "totalFrames": 300,
  "width": 1920,
  "height": 1080,
  "tokens": {
    "background": "#0F1115",
    "foreground": "#F4F1EA",
    "muted": "#9AA0A6",
    "accent": "#FF5A36",
    "fontFamily": "Arial, Helvetica, sans-serif",
    "marginRatio": 0.08
  },
  "motion": {
    "tempo": "calm",
    "entryFrames": 15,
    "exitFrames": 10,
    "lineStaggerFrames": 6,
    "itemStaggerFrames": 8,
    "entryEasing": "easeOutCubic",
    "exitEasing": "easeInCubic",
    "resolveEasing": "easeOutExpo",
    "transitions": [
      "mask reveal",
      "word stagger",
      "fade-scale resolve"
    ]
  },
  "copy": {
    "title-1": "Clear motion",
    "title-2": "starts with one idea",
    "step-1": "Plan",
    "step-2": "Build",
    "step-3": "Review",
    "end": "Ready to render"
  },
  "copyStatus": "illustrative",
  "assets": [],
  "acceptance": [
    "The title is fully readable from frame 24 until its exit begins",
    "The connector grows at constant speed and reaches the last step before its hold",
    "The final card is stable and unchanged from frame 230 to frame 299"
  ],
  "scenes": [
    {
      "id": "title",
      "start": 0,
      "end": 127,
      "purpose": "State the idea with a line mask reveal",
      "kind": "line-reveal",
      "params": {
        "lines": [
          "title-1",
          "title-2"
        ]
      },
      "copy": [
        "title-1",
        "title-2"
      ],
      "holds": [
        [
          24,
          117
        ]
      ],
      "focalPoint": "First headline line, left aligned on the margin",
      "entry": "Lines rise from their masks, 6 frames apart",
      "action": "Hold",
      "exit": "Fade and lift over the last 10 frames",
      "transition": "Overlaps the steps entry for 10 frames",
      "persistence": "None",
      "audio": "Silence",
      "acceptance": [
        "Both lines readable for at least 92 frames"
      ]
    },
    {
      "id": "steps",
      "start": 117,
      "end": 215,
      "purpose": "Three steps enter with a word stagger and a constant-speed connector",
      "kind": "item-stagger",
      "params": {
        "items": [
          "step-1",
          "step-2",
          "step-3"
        ],
        "connector": true
      },
      "copy": [
        "step-1",
        "step-2",
        "step-3"
      ],
      "holds": [
        [
          149,
          205
        ]
      ],
      "focalPoint": "The step that is currently entering, then the whole row",
      "entry": "Items rise and fade in, 8 frames apart",
      "action": "Connector grows linearly behind the items",
      "exit": "Fade and lift over the last 10 frames",
      "transition": "Overlaps the end card for 10 frames",
      "persistence": "Accent colour continues into the end card rule",
      "audio": "Silence",
      "acceptance": [
        "All three steps readable together for at least 55 frames"
      ]
    },
    {
      "id": "end",
      "start": 205,
      "end": 300,
      "purpose": "End card with the longest readable hold and a stable final frame",
      "kind": "end-card",
      "params": {
        "text": "end",
        "rule": true
      },
      "copy": [
        "end"
      ],
      "holds": [
        [
          230,
          300
        ]
      ],
      "focalPoint": "Centered end statement",
      "entry": "Fade and settle from 94% scale with ease-out expo",
      "action": "Accent rule grows under the statement",
      "exit": "None; stable final frame",
      "transition": "None",
      "persistence": "Final state holds to frame 299",
      "audio": "Silence",
      "acceptance": [
        "Frame 299 equals the settled end state"
      ]
    }
  ],
  "cues": []
}
</script>

<script>
(() => {
'use strict';
// BEGIN motion-scenes engine (copy of motion-scenes.mjs without export keywords)
// Declarative motion scene engine for the FrameCore Works Creative Studio motion contract.
// Dependency-free and runtime-agnostic: buildScene() describes the elements of a scene once,
// sceneFrame() returns their styles (and changing text) for one frame. DOM and React
// renderers only apply the result, so every runtime shows the same picture for a frame.
// Values follow references/motion-craft.md. Keep copies of this file byte-identical.

const bezier = (x1, y1, x2, y2) => x => {
  if (x <= 0 || x >= 1) return Math.min(1, Math.max(0, x));
  let lo = 0, hi = 1, u = x;
  for (let i = 0; i < 30; i++) {
    u = (lo + hi) / 2;
    const bx = 3 * (1 - u) * (1 - u) * u * x1 + 3 * (1 - u) * u * u * x2 + u * u * u;
    if (bx < x) lo = u; else hi = u;
  }
  return 3 * (1 - u) * (1 - u) * u * y1 + 3 * (1 - u) * u * u * y2 + u * u * u;
};

const easings = {
  easeOutCubic: bezier(0.33, 1, 0.68, 1),
  easeOutQuart: bezier(0.25, 1, 0.5, 1),
  easeOutExpo: bezier(0.16, 1, 0.3, 1),
  easeInOutCubic: bezier(0.65, 0, 0.35, 1),
  easeInCubic: bezier(0.32, 0, 0.67, 0),
  linear: x => Math.min(1, Math.max(0, x)),
};

/** Supported scene kinds and the params each one requires. */
const sceneKinds = {
  'line-reveal': {required: ['lines'], copyParams: ['lines']},
  'item-stagger': {required: ['items'], copyParams: ['items']},
  'end-card': {required: ['text'], copyParams: ['text']},
  'counter': {required: ['to'], copyParams: ['label']},
  'quote': {required: ['quote'], copyParams: ['quote', 'attribution']},
  'logo-reveal': {required: ['asset'], copyParams: []},
};

/** Eased 0..1 progress of an interval starting at master frame `start` and lasting `duration` frames. */
const progress = (frame, start, duration, easing = 'linear') => easings[easing]((frame - start) / duration);

const scale = score => score.height / 1080;
const px = (score, value) => Math.round(value * scale(score));
const motion = score => ({entryFrames: 15, exitFrames: 10, lineStaggerFrames: 6, itemStaggerFrames: 8, entryEasing: 'easeOutCubic', exitEasing: 'easeInCubic', resolveEasing: 'easeOutExpo', ...score.motion});
const margin = score => Math.round(score.width * (score.tokens?.marginRatio ?? 0.08));
const list = value => (Array.isArray(value) ? value : value === undefined ? [] : [value]);
const copy = (score, id) => score.copy?.[id] ?? '';
const isLast = (scene, score) => scene.end >= score.totalFrames;

const column = (score, align = 'left') => ({
  position: 'absolute', inset: '0', display: 'flex', flexDirection: 'column', justifyContent: 'center',
  alignItems: align === 'center' ? 'center' : 'stretch', padding: `0 ${margin(score)}px`, boxSizing: 'border-box',
});

/** Describe the scene's elements. Each node: {key, type: 'box' | 'text' | 'image', text?, src?, style, children?}. */
function buildScene(scene, score) {
  const p = scene.params ?? {}, t = score.tokens ?? {};
  switch (scene.kind) {
    case 'line-reveal': {
      const sizes = p.sizes ?? [132, 96], weights = p.weights ?? [700, 400];
      return {key: 'container', type: 'box', style: column(score, p.align), children: list(p.lines).map((id, i) => ({
        key: `mask-${i}`, type: 'box', style: {overflow: 'hidden', lineHeight: '1.1'},
        children: [{key: `line-${i}`, type: 'text', text: copy(score, id), style: {fontSize: `${px(score, sizes[i] ?? sizes[sizes.length - 1])}px`, fontWeight: String(weights[i] ?? weights[weights.length - 1])}}],
      }))};
    }
    case 'item-stagger': {
      const items = list(p.items).map((id, i) => ({key: `item-${i}`, type: 'text', text: copy(score, id), style: {position: 'relative', padding: `${px(score, 12)}px ${px(score, 36)}px`, background: t.background, fontSize: `${px(score, p.size ?? 104)}px`, fontWeight: String(p.weight ?? 700)}}));
      const row = {key: 'row', type: 'box', style: {position: 'relative', display: 'flex', justifyContent: 'space-between', alignItems: 'center'}, children: items};
      if (p.connector !== false) row.children = [{key: 'connector', type: 'box', style: {position: 'absolute', left: '0', right: '0', top: '50%', height: `${px(score, 6)}px`, background: t.accent, transformOrigin: 'left center'}}, ...items];
      return {key: 'container', type: 'box', style: column(score), children: [row]};
    }
    case 'end-card':
      return {key: 'container', type: 'box', style: column(score, 'center'), children: [
        {key: 'text', type: 'text', text: copy(score, p.text), style: {fontSize: `${px(score, p.size ?? 120)}px`, fontWeight: String(p.weight ?? 700)}},
        ...(p.rule === false ? [] : [{key: 'rule', type: 'box', style: {marginTop: `${px(score, 28)}px`, height: `${px(score, 6)}px`, width: `${px(score, 160)}px`, background: t.accent, transformOrigin: 'center'}}]),
      ]};
    case 'counter':
      return {key: 'container', type: 'box', style: column(score, p.align ?? 'center'), children: [
        {key: 'number', type: 'text', text: '', style: {fontSize: `${px(score, p.size ?? 220)}px`, fontWeight: '700', lineHeight: '1', fontVariantNumeric: 'tabular-nums'}},
        ...(p.label ? [{key: 'label', type: 'text', text: copy(score, p.label), style: {marginTop: `${px(score, 24)}px`, fontSize: `${px(score, p.labelSize ?? 48)}px`, color: t.muted ?? t.foreground}}] : []),
      ]};
    case 'quote':
      return {key: 'container', type: 'box', style: column(score, p.align ?? 'left'), children: [
        {key: 'quote', type: 'text', text: copy(score, p.quote), style: {maxWidth: '78%', fontSize: `${px(score, p.size ?? 72)}px`, lineHeight: '1.25', fontWeight: '400'}},
        ...(p.attribution ? [{key: 'attribution', type: 'text', text: copy(score, p.attribution), style: {marginTop: `${px(score, 36)}px`, fontSize: `${px(score, 40)}px`, color: t.muted ?? t.foreground}}] : []),
      ]};
    case 'logo-reveal': {
      const asset = (score.assets ?? []).find(item => item.id === p.asset);
      return {key: 'container', type: 'box', style: column(score, 'center'), children: [
        {key: 'logo', type: 'image', src: asset?.src ?? '', alt: asset?.alt ?? asset?.id ?? '', style: {width: `${px(score, p.width ?? 360)}px`, height: 'auto', display: 'block'}},
      ]};
    }
    default:
      throw new Error(`Unknown scene kind: ${scene.kind}`);
  }
}

/** Styles and changing text for one frame: {key: {style, text?}}. The scene is visible when start <= frame < end. */
function sceneFrame(scene, score, frame) {
  const p = scene.params ?? {}, m = motion(score), out = {};
  const exits = p.exit ?? !isLast(scene, score);
  const e = exits ? progress(frame, scene.end - m.exitFrames, m.exitFrames, m.exitEasing) : 0;
  out.container = {style: {opacity: String(1 - e), transform: `translateY(${-px(score, 24) * e}px)`}};
  switch (scene.kind) {
    case 'line-reveal':
      list(p.lines).forEach((_, i) => {
        const k = progress(frame, scene.start + i * m.lineStaggerFrames, m.entryFrames, m.entryEasing);
        out[`line-${i}`] = {style: {transform: `translateY(${(1 - k) * 110}%)`}};
      });
      break;
    case 'item-stagger': {
      const n = list(p.items).length, lastEntryEnd = scene.start + (n - 1) * m.itemStaggerFrames + m.entryFrames;
      if (p.connector !== false) out.connector = {style: {transform: `scaleX(${progress(frame, scene.start + 6, lastEntryEnd - scene.start - 6, 'linear')})`}};
      for (let i = 0; i < n; i++) {
        const k = progress(frame, scene.start + i * m.itemStaggerFrames, m.entryFrames, m.entryEasing);
        out[`item-${i}`] = {style: {opacity: String(k), transform: `translateY(${(1 - k) * px(score, 32)}px)`}};
      }
      break;
    }
    case 'end-card': {
      const k = progress(frame, scene.start, p.duration ?? 30, m.resolveEasing);
      out.text = {style: {opacity: String(k), transform: `scale(${0.94 + 0.06 * k})`}};
      if (p.rule !== false) out.rule = {style: {transform: `scaleX(${k})`}};
      break;
    }
    case 'counter': {
      // The label and unit settle first; the number counts only once they are readable.
      const label = progress(frame, scene.start, m.entryFrames, m.entryEasing);
      const k = progress(frame, scene.start + m.entryFrames, p.duration ?? 45, p.easing ?? 'easeOutCubic');
      const value = (p.from ?? 0) + ((p.to ?? 0) - (p.from ?? 0)) * k;
      const format = new Intl.NumberFormat(p.locale ?? 'en-US', {minimumFractionDigits: p.decimals ?? 0, maximumFractionDigits: p.decimals ?? 0});
      out.number = {style: {opacity: String(label)}, text: `${p.prefix ?? ''}${format.format(value)}${p.suffix ?? ''}`};
      if (p.label) out.label = {style: {opacity: String(label), transform: `translateY(${(1 - label) * px(score, 16)}px)`}};
      break;
    }
    case 'quote': {
      // Whole-phrase reveal; the attribution follows once the quotation has settled.
      const k = progress(frame, scene.start, m.entryFrames + 5, m.entryEasing);
      out.quote = {style: {opacity: String(k), transform: `translateY(${(1 - k) * px(score, 24)}px)`}};
      if (p.attribution) out.attribution = {style: {opacity: String(progress(frame, scene.start + (p.attributionDelay ?? 30), m.entryFrames, m.entryEasing))}};
      break;
    }
    case 'logo-reveal': {
      // Reveal by clipping only: the mark is never scaled, skewed or recoloured.
      const k = progress(frame, scene.start, p.duration ?? 30, m.resolveEasing);
      out.logo = {style: {clipPath: p.reveal === 'wipe' ? `inset(0 ${(1 - k) * 100}% 0 0)` : `circle(${k * 75}% at 50% 50%)`}};
      break;
    }
    default:
      throw new Error(`Unknown scene kind: ${scene.kind}`);
  }
  return out;
}

/** Index a built scene tree by key. */
function nodesByKey(node, map = {}) {
  map[node.key] = node;
  for (const child of node.children ?? []) nodesByKey(child, map);
  return map;
}
// END motion-scenes engine

  const score = JSON.parse(document.getElementById('motion-score').textContent);
  const fps = score.fps.num / score.fps.den, N = score.totalFrames, t = score.tokens || {};
  const stage = document.getElementById('stage');
  Object.assign(stage.style, {width: score.width + 'px', height: score.height + 'px', background: t.background, color: t.foreground, fontFamily: t.fontFamily});

  // Generic DOM renderer: build each scene's element tree once, then apply per-frame styles.
  const create = (node, elements) => {
    const el = document.createElement(node.type === 'image' ? 'img' : 'div');
    Object.assign(el.style, node.style || {});
    if (node.type === 'text') el.textContent = node.text;
    if (node.type === 'image') { el.src = node.src; el.alt = node.alt || ''; }
    for (const child of node.children || []) el.append(create(child, elements));
    elements[node.key] = el;
    return el;
  };
  const scenes = score.scenes.map(scene => {
    const elements = {}, root = create(buildScene(scene, score), elements);
    root.style.visibility = 'hidden';
    stage.append(root);
    return {scene, root, elements};
  });

  /** Draw exactly one frame. Visible scenes satisfy start <= frame < end. */
  function renderFrame(frame) {
    for (const {scene, root, elements} of scenes) {
      const active = frame >= scene.start && frame < scene.end;
      root.style.visibility = active ? 'visible' : 'hidden';
      if (!active) continue;
      for (const [key, value] of Object.entries(sceneFrame(scene, score, frame))) {
        const el = elements[key];
        if (!el) continue;
        Object.assign(el.style, value.style || {});
        if (value.text !== undefined) el.textContent = value.text;
      }
    }
  }

  // Player: the clock only chooses which frame to draw.
  const scrub = document.getElementById('scrub'), readout = document.getElementById('readout'), play = document.getElementById('play');
  scrub.max = String(N - 1);
  let current = 0, playing = false, startedAt = 0, startFrame = 0;
  function seekFrame(frame) {
    current = Math.min(N - 1, Math.max(0, Math.round(Number(frame) || 0)));
    renderFrame(current);
    scrub.value = String(current);
    readout.textContent = `frame ${current} / ${N - 1}`;
    return current;
  }
  const stop = () => { playing = false; play.textContent = 'Play'; };
  function tick(now) {
    if (!playing) return;
    const frame = startFrame + Math.floor((now - startedAt) / 1000 * fps);
    seekFrame(frame);
    if (frame >= N - 1) { stop(); return; }
    requestAnimationFrame(tick);
  }
  play.onclick = () => {
    if (playing) { stop(); return; }
    playing = true; play.textContent = 'Pause';
    startFrame = current >= N - 1 ? 0 : current; startedAt = performance.now();
    requestAnimationFrame(tick);
  };
  document.getElementById('replay').onclick = () => { stop(); seekFrame(0); play.click(); };
  document.getElementById('back').onclick = () => { stop(); seekFrame(current - 1); };
  document.getElementById('next').onclick = () => { stop(); seekFrame(current + 1); };
  scrub.oninput = () => { stop(); seekFrame(scrub.value); };
  addEventListener('keydown', event => {
    if (event.key === ' ') { event.preventDefault(); play.click(); }
    if (event.key === 'ArrowLeft') { stop(); seekFrame(current - 1); }
    if (event.key === 'ArrowRight') { stop(); seekFrame(current + 1); }
  });

  const fit = () => {
    const viewport = document.getElementById('viewport');
    const s = Math.min(viewport.clientWidth / score.width, viewport.clientHeight / score.height);
    stage.style.transform = `scale(${s}) translate(-50%, -50%)`;
  };
  addEventListener('resize', fit);
  fit();
  window.seekFrame = seekFrame;
  window.motionScore = score;

  // ?frame=140 opens one frame; ?frames=299,0,140 replays a seek sequence for review comparisons.
  const query = new URLSearchParams(location.search);
  for (const frame of (query.get('frames') || query.get('frame') || '0').split(',')) seekFrame(frame);
  document.documentElement.dataset.ready = 'true';
})();
</script>
</body>
</html>
