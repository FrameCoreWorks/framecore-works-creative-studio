<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'none'; object-src 'none'; base-uri 'none'">
<title>FrameCore Motion Toolkit</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#182023;color:#f3eee2;font:16px system-ui,sans-serif}main{max-width:960px;margin:48px auto;padding:0 24px}h1{font-size:34px;margin-bottom:8px}p{line-height:1.5;color:#c5c8c8}.preview{background:#f3eee2;margin:28px 0 20px;border-radius:4px;overflow:hidden}canvas{display:block;width:100%;height:auto}label{display:flex;gap:12px;align-items:center}.controls{display:flex;gap:12px;flex-wrap:wrap;margin:16px 0}button,select{font:inherit;border:1px solid #687475;background:#253032;color:#f3eee2;padding:9px 14px;border-radius:4px}button{cursor:pointer}button:disabled{opacity:.45}input[type=range]{flex:1}#status{padding:16px;border:1px solid #687475;line-height:1.5}#downloads a{display:block;color:#f2b098;margin:12px 0}small{display:block;color:#b1b9b8;line-height:1.5}
</style></head><body><main>
<h1>Motion Toolkit</h1><p>Three original examples. One frame clock. Local preview and export.</p>
<label>Scene <select id="scene"><option value="data">D3 · Data in motion</option><option value="particles">PixiJS · Order from motion</option><option value="lottie">Lottie · Vector reuse</option></select></label>
<div class="preview"><canvas width="640" height="360" aria-label="Motion preview"></canvas></div>
<label><span id="frame-label">Frame 0 / 179</span><input id="frame" aria-label="Frame" type="range" min="0" max="179" step="1" value="0"></label>
<div class="controls"><button id="play">Play</button><button id="replay">Replay</button><button id="check">Check frame seeking</button></div>
<div class="controls"><select id="format" aria-label="Export format"><option value="mp4">MP4 · H.264</option><option value="webm">WebM · VP9</option></select><button id="export">Encode video</button><button id="cancel" disabled>Cancel export</button></div>
<div id="status" role="status" aria-live="polite">Loading local modules…</div><div id="downloads"></div>
<p><small>640 × 360 · 30 FPS · 180 frames · 6 seconds · intentional silence.<br>System Arial is illustrative. No uploaded assets or external asset requests. Codec availability depends on your browser.</small></p>
</main><script type="module" src="./app.js"></script></body></html>
