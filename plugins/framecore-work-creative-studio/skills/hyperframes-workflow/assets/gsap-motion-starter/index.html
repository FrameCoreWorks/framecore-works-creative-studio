<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GSAP motion starter</title>
  <script type="importmap">{"imports": {"gsap": "./node_modules/gsap/index.js"}}</script>
  <style>
    body { margin: 0; background: #202124; color: #e8eaed; font: 14px system-ui, sans-serif; }
    #viewport { width: 100vw; aspect-ratio: 16 / 9; max-height: calc(100vh - 56px); overflow: hidden; position: relative; }
    #stage { position: absolute; left: 0; top: 0; transform-origin: 0 0; overflow: hidden; }
    .scene { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; visibility: hidden; }
    .mask { overflow: hidden; line-height: 1.1; }
    #controls { display: flex; gap: 12px; align-items: center; padding: 12px 16px; }
    #scrub { flex: 1; }
  </style>
</head>
<body>
  <div id="viewport"><div id="stage"></div></div>
  <div id="controls">
    <button id="play" type="button">Play</button>
    <button id="replay" type="button">Replay</button>
    <input id="scrub" type="range" min="0" value="0" step="1" aria-label="Frame">
    <output id="readout">frame 0</output>
  </div>
  <script type="module" src="main.mjs"></script>
</body>
</html>
