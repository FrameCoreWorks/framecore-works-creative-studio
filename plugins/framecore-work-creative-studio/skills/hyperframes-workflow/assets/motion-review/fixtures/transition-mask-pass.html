<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><title>Intentional transition mask</title>
<style>
html,body{margin:0;background:#111}
#root{position:relative;width:1080px;height:1920px;overflow:hidden;background:#f3efe7;font-family:"DejaVu Sans",Arial,sans-serif;color:#151515}
.scene{position:absolute;inset:0;overflow:hidden}
.headline{position:absolute;left:90px;top:300px;width:900px;font-size:120px;font-weight:800;line-height:1.02;letter-spacing:-3px;margin:0}
.floor-word{position:absolute;left:70px;bottom:260px;font-size:182px;font-weight:800;letter-spacing:-9px;white-space:nowrap;color:#e7e1d8}
.cta{position:absolute;left:90px;top:1300px;font-size:80px;font-weight:700;white-space:nowrap}
</style></head>
<body>
<div id="root" data-composition-id="main" data-width="1080" data-height="1920" data-duration="3">
<div class="scene"><h1 class="headline" id="reveal">Twój zapach</h1><div class="cta" id="cta">Sprawdź perfua.pl</div></div>
</div>
<script>
// A HyperFrames-style timeline registry without GSAP, so the fixture runs offline: seek(t) sets every state.
window.__timelines = window.__timelines || {};
window.__timelines.main = {seek(t) { const p=Math.min(1,Math.max(0,t)); document.getElementById('reveal').style.clipPath='inset(0 '+((1-p)*100)+'% 0 0)'; document.getElementById('cta').style.transform='translateX('+((1-p)*700)+'px)'; }, pause() {}};
window.__timelines.main.seek(0);
</script>
</body></html>
